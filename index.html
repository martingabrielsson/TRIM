    const jApply = root.querySelector('#journal-apply');
    const jClear = root.querySelector('#journal-clear');
    if (jApply) {
      jApply.addEventListener('click', () => {
        journalFrom = root.querySelector('#journal-from').value || '';
        journalTo = root.querySelector('#journal-to').value || '';
        journalTagFilter = root.querySelector('#journal-tag-filter').value || '';
        journalMistakeFilter = root.querySelector('#journal-mistake-filter').value || '';
        journalRulesBrokenOnly = root.querySelector('#journal-rules-broken').checked;
        render();
      });
    }
    if (jClear) {
      jClear.addEventListener('click', () => {
        journalFrom = ''; journalTo = ''; journalTagFilter = ''; journalMistakeFilter = ''; journalRulesBrokenOnly = false;
        render();
      });
    }
  }

  /* ---------- board ---------- */

  function computeBoardStats() {
    const days = boardDays();
    const today = todayLocalStr();
    const counts = { g: 0, y: 0, r: 0, b: 0 };
    let marked = 0;
    let elapsed = 0;
    let lastRed = null;
    let longest = 0, running = 0;

    for (const d of days) {
      if (d <= today) elapsed++;
      const m = boardMarks[d];
      if (!m) { running = 0; continue; }
      marked++;
      counts[m]++;
      if (m === 'b') continue; // sitting out neither extends nor breaks a streak
      if (m === 'g') {
        running++;
        if (running > longest) longest = running;
      } else {
        running = 0;
        if (m === 'r') lastRed = d;
      }
    }

    // Current streak: walk back from the most recent marked day. An unmarked day
    // breaks it, so the number never flatters a board with gaps in it. Days marked
    // "didn't trade" are stepped over.
    let current = 0;
    let started = false;
    for (let i = days.length - 1; i >= 0; i--) {
      const m = boardMarks[days[i]];
      if (!started) {
        if (!m) continue;
        started = true;
      }
      if (m === 'b') continue;
      if (m === 'g') current++;
      else break;
    }

    const traded = counts.g + counts.y + counts.r;
    return {
      total: days.length, elapsed, marked, traded, counts, lastRed,
      currentStreak: current,
      longestStreak: longest,
      unmarkedElapsed: Math.max(elapsed - marked, 0),
      discipline: traded ? (counts.g / traded) * 100 : null
    };
  }

  function renderBoardStats() {
    const s = computeBoardStats();
    const ticks = Array.from({length: 9}).map(() => '<div></div>').join('');
    const discCls = s.discipline == null ? 'neutral' : (s.discipline >= 80 ? 'positive' : (s.discipline < 50 ? 'negative' : 'neutral'));
    return `
      <div class="stat-row" style="grid-template-columns: repeat(6, 1fr);">
        ${statCard(ticks, 'Elapsed', s.elapsed, 'neutral', `${s.total - s.elapsed} of ${s.total} still ahead`)}
        ${statCard(ticks, 'Marked', s.marked, 'neutral', `${s.unmarkedElapsed} elapsed day${s.unmarkedElapsed === 1 ? '' : 's'} blank`)}
        ${statCard(ticks, 'Traded', s.traded, 'neutral', `${s.counts.b} day${s.counts.b === 1 ? '' : 's'} sat out`)}
        ${statCard(ticks, 'Discipline', s.discipline == null ? '—' : `${s.discipline.toFixed(0)}%`, discCls, `${s.counts.g} green of ${s.traded} traded`)}
        ${statCard(ticks, 'Current streak', s.currentStreak, s.currentStreak > 0 ? 'positive' : 'neutral', 'consecutive green')}
        ${statCard(ticks, 'Longest streak', s.longestStreak, 'neutral', s.lastRed ? `last red ${s.lastRed}` : 'no red days yet')}
      </div>
    `;
  }

  function renderBoardBreakdown() {
    const rows = boardBands().map(band => {
      const c = { g: 0, y: 0, r: 0, b: 0 };
      let marked = 0;
      for (const d of band.days) {
        const m = boardMarks[d];
        if (!m) continue;
        marked++;
        c[m]++;
      }
      const pct = k => (marked ? (c[k] / marked) * 100 : 0);
      const traded = c.g + c.y + c.r;
      const disc = traded ? (c.g / traded) * 100 : null;
      return `
        <div class="bar-row">
          <div class="bar-label">Year ${band.index}</div>
          <div class="bar-track">
            ${marked ? `<div class="board-stack">
              <div class="seg g" style="width:${pct('g')}%"></div>
              <div class="seg y" style="width:${pct('y')}%"></div>
              <div class="seg r" style="width:${pct('r')}%"></div>
              <div class="seg b" style="width:${pct('b')}%"></div>
            </div>` : ''}
          </div>
          <div class="bar-value ${disc == null ? '' : (disc >= 80 ? 'pos' : (disc < 50 ? 'neg' : ''))}">${disc == null ? '—' : disc.toFixed(0) + '%'}</div>
          <div class="bar-meta">${marked}/${band.days.length} marked · ${c.b} sat out</div>
        </div>
      `;
    }).join('');
    return `<div class="bar-group">${rows}</div>`;
  }

  function renderBoardGrid() {
    const today = todayLocalStr();
    let n = 0;
    let prevMonth = null; // 'YYYY-MM' of the previous cell, so each month gets exactly one tick
    return boardBands().map(band => {
      const marked = band.days.filter(d => boardMarks[d]).length;
      const cells = band.days.map(iso => {
        n++;
        const dt = utcFromISO(iso);
        const mo = dt.getUTCMonth();
        const monthKey = iso.slice(0, 7);
        const firstOfMonth = monthKey !== prevMonth;
        prevMonth = monthKey;
        const cls = ['board-cell'];
        if (firstOfMonth) cls.push(mo % 3 === 0 ? 'quarter-start' : 'month-start');
        if (iso > today) cls.push('future');
        if (iso === today) cls.push('today');
        if (iso === boardFlashDate) cls.push('flash');
        if (boardComments[iso]) cls.push('has-comment');
        const mark = boardMarks[iso];
        return `<button type="button" class="${cls.join(' ')}" data-d="${iso}" data-n="${n}"${mark ? ` data-mark="${mark}"` : ''} tabindex="-1"></button>`;
      }).join('');
      return `
        <div class="board-band">
          <div class="board-band-header">
            <div class="board-band-title">YEAR ${band.index}</div>
            <div class="board-band-range">${band.label.toUpperCase()}</div>
            <div class="board-band-meta">${marked} / ${band.days.length} marked</div>
          </div>
          <div class="board-grid">${cells}</div>
        </div>
      `;
    }).join('');
  }

  function renderBoardCommentInner() {
    if (!boardFocusedDate) {
      return `<span class="placeholder">CLICK OR FOCUS A DAY ABOVE TO ADD A COMMENT</span>`;
    }
    const text = boardComments[boardFocusedDate] || '';
    return `
      <label class="board-comment-label">COMMENT — ${fmtBoardDate(boardFocusedDate)}</label>
      <textarea id="board-comment-text" placeholder="What happened this day?">${text.replace(/</g, '&lt;')}</textarea>
    `;
  }

  function renderBoardTab() {
    const days = boardDays();
    const density = (boardPrefs && boardPrefs.density) || 'm';
    const closures = (boardPrefs && boardPrefs.closures) || [];

    const densityBtn = (k, label) => `<button class="filter-btn ${density === k ? '' : 'ghost'}" data-density="${k}">${label}</button>`;

    return `
      <div class="board dense-${density}">
        <div class="filter-bar">
          <div class="board-legend">
            <span class="leg"><span class="swatch g"></span>FOLLOWED MY PLAN</span>
            <span class="leg"><span class="swatch y"></span>MINOR DEVIATION</span>
            <span class="leg"><span class="swatch r"></span>BROKE MY RULES</span>
            <span class="leg"><span class="swatch b"></span>DIDN'T TRADE</span>
            <span class="leg"><span class="swatch n"></span>UNMARKED</span>
          </div>
          <div class="filter-count">${days.length} trading days</div>
        </div>

        <div class="filter-bar" style="margin-top:-8px;">
          <label>JUMP TO <input type="date" id="board-jump" min="${BOARD_START}" max="${BOARD_END}"></label>
          <button class="filter-btn" id="board-today">Today</button>
          <label style="margin-left:8px;">SIZE</label>
          ${densityBtn('s', 'S')}${densityBtn('m', 'M')}${densityBtn('l', 'L')}
          <div class="filter-count">click cycles green → yellow → red → black → blank · shift-click or right-click clears · arrows + G/Y/R/B from the keyboard</div>
        </div>

        <div class="board-readout" id="board-readout">
          <span class="placeholder">HOVER A DAY TO READ IT</span>
        </div>

        <div class="board-comment" id="board-comment">${renderBoardCommentInner()}</div>

        <div id="board-stats">${renderBoardStats()}</div>

        <div id="board-canvas">${renderBoardGrid()}</div>

        <div class="section-label" style="margin-top:26px;">BY TRADING YEAR <span class="section-hint">— bar is the split of marked days; the percentage is green as a share of days actually traded, so sitting out never moves it</span></div>
        ${renderBoardBreakdown()}

        <div class="footnote" style="margin-top:20px;">
          Holidays are derived from the exchange's own rules — weekends, New Year's Day, Martin Luther King Jr. Day,
          Washington's Birthday, Good Friday, Memorial Day, Juneteenth, Independence Day, Labor Day, Thanksgiving and
          Christmas, each observed on the preceding Friday when it falls on a Saturday and the following Monday when it
          falls on a Sunday. Unscheduled closures can't be predicted five years out: shift-right-click a square to drop it
          from the board if the exchange turns out to be shut that day.
          ${closures.length ? `<br>Removed as non-trading: <span class="mono">${closures.join(', ')}</span> — <button class="mini-btn" id="board-restore-closures">restore all</button>` : ''}
        </div>
      </div>
    `;
  }

  function wireBoardTab() {
    const canvas = root.querySelector('#board-canvas');
    if (!canvas) return;
    const readout = root.querySelector('#board-readout');
    const statsEl = root.querySelector('#board-stats');
    const commentEl = root.querySelector('#board-comment');
    const days = boardDays();

    function wireCommentTextarea() {
      const ta = root.querySelector('#board-comment-text');
      if (!ta) return;
      ta.addEventListener('input', () => {
        const iso = boardFocusedDate;
        const val = ta.value;
        if (val.trim()) boardComments[iso] = val; else delete boardComments[iso];
        saveBoardComments();
        const cellEl = canvas.querySelector(`.board-cell[data-d="${iso}"]`);
        if (cellEl) cellEl.classList.toggle('has-comment', !!val.trim());
      });
    }

    function refreshComment() {
      if (commentEl) commentEl.innerHTML = renderBoardCommentInner();
      wireCommentTextarea();
    }
    refreshComment();

    // Only the stat row is re-rendered on a mark — rebuilding all 1255 cells
    // through render() would throw away scroll position and focus on every click.
    function refreshStats() {
      if (statsEl) statsEl.innerHTML = renderBoardStats();
      const band = canvas.querySelectorAll('.board-band');
      boardBands().forEach((b, i) => {
        const meta = band[i] && band[i].querySelector('.board-band-meta');
        if (meta) meta.textContent = `${b.days.filter(d => boardMarks[d]).length} / ${b.days.length} marked`;
      });
    }

    function describe(el) {
      const iso = el.dataset.d;
      const mark = el.dataset.mark;
      return `
        <span class="dot ${mark || ''}"></span>
        <span>${fmtBoardDate(iso)}</span>
        <span class="sep">·</span>
        <span class="muted">day ${el.dataset.n} of ${days.length}</span>
        <span class="sep">·</span>
        <span>${mark ? BOARD_LABELS[mark] : 'unmarked'}</span>
      `;
    }

    function setMark(el, mark) {
      const iso = el.dataset.d;
      if (mark) {
        boardMarks[iso] = mark;
        el.dataset.mark = mark;
      } else {
        delete boardMarks[iso];
        delete el.dataset.mark;
      }
      saveBoard();
      refreshStats();
      if (readout) readout.innerHTML = describe(el);
    }

    function cycle(el) {
      const at = BOARD_CYCLE.indexOf(el.dataset.mark || '');
      setMark(el, BOARD_CYCLE[at + 1] || '');
    }

    let cursor = null;
    function focusCell(el) {
      if (!el) return;
      if (cursor) cursor.tabIndex = -1;
      cursor = el;
      el.tabIndex = 0;
      el.focus({ preventScroll: false });
      if (readout) readout.innerHTML = describe(el);
      if (boardFocusedDate !== el.dataset.d) {
        boardFocusedDate = el.dataset.d;
        refreshComment();
      }
    }

    canvas.addEventListener('mouseover', e => {
      const el = e.target.closest('.board-cell');
      if (!el || !readout) return;
      if (!el.title) el.title = `${fmtBoardDate(el.dataset.d)} · day ${el.dataset.n} of ${days.length}`;
      readout.innerHTML = describe(el);
    });

    canvas.addEventListener('click', e => {
      const el = e.target.closest('.board-cell');
      if (!el) return;
      focusCell(el);
      if (e.shiftKey) setMark(el, '');
      else cycle(el);
    });

    canvas.addEventListener('contextmenu', e => {
      const el = e.target.closest('.board-cell');
      if (!el) return;
      e.preventDefault();
      focusCell(el);
      if (e.shiftKey) {
        // Drop the day from the board entirely — an unscheduled exchange closure.
        const iso = el.dataset.d;
        boardPrefs.closures = [...new Set([...(boardPrefs.closures || []), iso])].sort();
        delete boardMarks[iso];
        boardDaysCache = null;
        saveBoard();
        saveBoardPrefs();
        status = { msg: `${iso} removed from the board as a non-trading day.`, error: false };
        render();
        return;
      }
      setMark(el, '');
    });

    canvas.addEventListener('keydown', e => {
      const el = e.target.closest('.board-cell');
      if (!el) return;
      const key = e.key.toLowerCase();
      if (key === 'g' || key === 'y' || key === 'r' || key === 'b') { e.preventDefault(); setMark(el, key); return; }
      if (key === 'n') { e.preventDefault(); setMark(el, 'b'); return; } // n for "no trade"
      if (key === '0' || key === 'delete' || key === 'backspace') { e.preventDefault(); setMark(el, ''); return; }
      if (key === ' ' || key === 'enter') { e.preventDefault(); cycle(el); return; }

      const all = [...canvas.querySelectorAll('.board-cell')];
      const at = all.indexOf(el);
      const perRow = getComputedStyle(el.parentElement).gridTemplateColumns.split(' ').length;
      let next = null;
      if (e.key === 'ArrowRight') next = all[at + 1];
      else if (e.key === 'ArrowLeft') next = all[at - 1];
      else if (e.key === 'ArrowDown') next = all[at + perRow] || all[all.length - 1];
      else if (e.key === 'ArrowUp') next = all[at - perRow] || all[0];
      else if (e.key === 'Home') next = all[0];
      else if (e.key === 'End') next = all[all.length - 1];
      if (next) { e.preventDefault(); focusCell(next); }
    });

    function jumpTo(iso) {
      if (!iso) return;
      // Land on the first trading day on or after the requested date.
      const target = days.find(d => d >= iso) || days[days.length - 1];
      const el = canvas.querySelector(`.board-cell[data-d="${target}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1900);
      focusCell(el);
    }

    const jump = root.querySelector('#board-jump');
    if (jump) jump.addEventListener('change', () => jumpTo(jump.value));
    const todayBtn = root.querySelector('#board-today');
    if (todayBtn) todayBtn.addEventListener('click', () => jumpTo(todayLocalStr()));

    root.querySelectorAll('[data-density]').forEach(btn => {
      btn.addEventListener('click', () => {
        boardPrefs.density = btn.dataset.density;
        saveBoardPrefs();
        render();
      });
    });

    const restore = root.querySelector('#board-restore-closures');
    if (restore) {
      restore.addEventListener('click', () => {
        boardPrefs.closures = [];
        boardDaysCache = null;
        saveBoardPrefs();
        status = { msg: 'Removed days restored to the board.', error: false };
        render();
      });
    }

    // Make one cell tab-reachable so the grid is a single stop in the tab order.
    const start = canvas.querySelector(`.board-cell[data-d="${days.find(d => d >= todayLocalStr()) || days[0]}"]`) || canvas.querySelector('.board-cell');
    if (start) { start.tabIndex = 0; cursor = start; }

    if (boardFlashDate) {
      const el = canvas.querySelector(`.board-cell[data-d="${boardFlashDate}"]`);
      if (el) el.scrollIntoView({ behavior: 'auto', block: 'center' });
      boardFlashDate = null;
    }
  }

  function renderDataTab() {
    const ticks = Array.from({length: 9}).map(() => '<div></div>').join('');
    let dateRange = '—';
    if (trades.length) {
      const dates = trades.map(t => tradeLocalDateStr(t)).sort();
      dateRange = dates[0] === dates[dates.length - 1] ? dates[0] : `${dates[0]} → ${dates[dates.length - 1]}`;
    }
    const rulesConfigured = !!(rules && (
      rules.dailyLossLimit != null || rules.maxTradesPerDay != null || rules.maxSizePerTrade != null ||
      rules.maxConsecutiveLosses != null || rules.sessionsToTrade || rules.maxTimeBeforeBreak != null || rules.notes
    ));

    const summaryHtml = `
      <div class="stat-row" style="grid-template-columns: repeat(5, 1fr);">
        ${statCard(ticks, 'Trades stored', trades.length, 'neutral')}
        ${statCard(ticks, 'Date range', dateRange, 'neutral')}
        ${statCard(ticks, 'Journal entries', journalEntries.length, 'neutral')}
        ${statCard(ticks, 'Board days marked', Object.keys(boardMarks).length, 'neutral')}
        ${statCard(ticks, 'Rules configured', rulesConfigured ? 'Yes' : 'No', rulesConfigured ? 'positive' : 'neutral')}
      </div>
    `;

    const exportHtml = `
      <div class="rules-panel">
        <div class="section-label">EXPORT BACKUP <span class="section-hint">— every trade, journal entry and rule setting, as one JSON file</span></div>
        <p style="font-size:12.5px; color:var(--muted); margin: 0 0 14px 0; line-height:1.6;">
          Downloads <span class="mono">trim-backup-${todayLocalStr()}.json</span>. Keep it somewhere safe — it's the only way to move this data to another browser or recover it if storage is cleared.
        </p>
        <button class="upload-btn" id="export-btn">Export backup</button>
        ${exportFallback ? `
          <div class="section-label" style="margin-top:18px;">COULDN'T TRIGGER A DOWNLOAD <span class="section-hint">— copy the text below and save it as a .json file yourself</span></div>
          <textarea readonly style="min-height:140px;" onclick="this.select()">${exportFallback.replace(/</g, '&lt;')}</textarea>
        ` : ''}
      </div>
    `;

    const importHtml = `
      <div class="rules-panel" style="margin-top:20px;">
        <div class="section-label">IMPORT BACKUP</div>
        <div class="upload-zone" id="backup-zone">
          <div class="icon-line">&#9650; DROP BACKUP JSON OR SELECT FILE</div>
          <div class="sub">Trades and journal entries are matched by id — existing ones are kept, only new ones are added. Board marks fill empty days only. Rules are replaced by the file's.</div>
          <button class="upload-btn" id="backup-btn">Select backup file</button>
          <input type="file" id="backup-file-input" accept=".json" style="display:none;">
          ${status.msg ? `<div class="upload-status ${status.error ? 'error' : ''}">${status.msg}</div>` : ''}
        </div>
        ${importSummary ? `
          <div class="callout ${importSummary.added || importSummary.journalAdded || importSummary.boardAdded || importSummary.rulesReplaced ? 'positive' : 'neutral'}">
            Trades: <strong>${importSummary.added}</strong> added, ${importSummary.skipped} duplicate${importSummary.skipped === 1 ? '' : 's'} skipped.
            Journal: <strong>${importSummary.journalAdded}</strong> added, ${importSummary.journalSkipped} duplicate${importSummary.journalSkipped === 1 ? '' : 's'} skipped.
            Board: <strong>${importSummary.boardAdded || 0}</strong> day${(importSummary.boardAdded || 0) === 1 ? '' : 's'} added, ${importSummary.boardSkipped || 0} already marked.
            Comments: <strong>${importSummary.commentsAdded || 0}</strong> added, ${importSummary.commentsSkipped || 0} already had one.
            ${importSummary.rulesReplaced ? ' Rules replaced.' : ''}
          </div>
        ` : ''}
      </div>
    `;

    const rangeTradeCount = tradesInClearRange().length;
    const rangeJournalCount = journalInClearRange().length;
    const rangeEmpty = !clearFrom && !clearTo;
    const rangeArmed = clearArmed === 'range';
    const rangeLabel = rangeArmed
      ? `Confirm: delete ${rangeTradeCount} trade${rangeTradeCount === 1 ? '' : 's'}, ${rangeJournalCount} entr${rangeJournalCount === 1 ? 'y' : 'ies'}`
      : 'Clear range';

    const clearBtn = (action, label, count) => {
      const armed = clearArmed === action;
      const text = armed ? `Confirm: delete ${count}` : label;
      return `<button class="mini-btn danger" data-clear-action="${action}">${text}</button>`;
    };

    const clearHtml = `
      <div class="rules-panel" style="margin-top:20px;">
        <div class="section-label">CLEAR DATA</div>
        <div class="callout negative">This cannot be undone. Export a backup above first if you're not sure.</div>

        <div class="journal-form-header" style="margin-top:18px;">CLEAR BY DATE RANGE</div>
        <div class="filter-bar">
          <label>FROM <input type="date" id="clear-from" value="${clearFrom}"></label>
          <label>TO <input type="date" id="clear-to" value="${clearTo}"></label>
          <div class="filter-count">${rangeTradeCount} trade${rangeTradeCount === 1 ? '' : 's'}, ${rangeJournalCount} entr${rangeJournalCount === 1 ? 'y' : 'ies'} in range</div>
          <button class="mini-btn danger" id="clear-range-btn" ${rangeEmpty ? 'disabled' : ''}>${rangeLabel}</button>
        </div>
        ${rangeEmpty ? `<div class="section-hint" style="margin-top:6px;">Set a FROM and/or TO date to enable this — an empty range clears nothing here (use the buttons below to clear everything).</div>` : ''}

        <div class="journal-form-header" style="margin-top:22px;">CLEAR EVERYTHING</div>
        <div class="journal-form-actions" style="flex-wrap:wrap; gap:10px;">
          ${clearBtn('trades', 'Clear all trades', trades.length)}
          ${clearBtn('journal', 'Clear all journal entries', journalEntries.length)}
          ${clearBtn('rules', 'Reset rules to defaults', 1)}
          ${clearBtn('board', 'Clear all board marks & comments', Object.keys(boardMarks).length + Object.keys(boardComments).length)}
          ${clearBtn('all', 'Erase all TRIM data', trades.length + journalEntries.length + Object.keys(boardMarks).length)}
        </div>
      </div>
    `;

    return summaryHtml + exportHtml + importHtml + clearHtml;
  }

  function wireDataTab() {
    const exportBtn = root.querySelector('#export-btn');
    if (exportBtn) exportBtn.addEventListener('click', exportData);

    const zone = root.querySelector('#backup-zone');
    const fileInput = root.querySelector('#backup-file-input');
    const backupBtn = root.querySelector('#backup-btn');
    if (zone) {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleBackupFile(e.dataTransfer.files[0]);
      });
      backupBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBackupFile(e.target.files[0]);
        e.target.value = '';
      });
    }

    const clearFromInput = root.querySelector('#clear-from');
    const clearToInput = root.querySelector('#clear-to');
    if (clearFromInput) {
      clearFromInput.addEventListener('input', () => {
        clearFrom = clearFromInput.value || '';
        clearArmed = null;
        render();
      });
    }
    if (clearToInput) {
      clearToInput.addEventListener('input', () => {
        clearTo = clearToInput.value || '';
        clearArmed = null;
        render();
      });
    }

    const clearRangeBtn = root.querySelector('#clear-range-btn');
    if (clearRangeBtn) {
      clearRangeBtn.addEventListener('click', () => {
        if (clearArmed === 'range') { clearByRange(); }
        else { clearArmed = 'range'; render(); }
      });
    }

    root.querySelectorAll('[data-clear-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.clearAction;
        if (clearArmed !== action) { clearArmed = action; render(); return; }
        if (action === 'trades') clearAllTrades();
        else if (action === 'journal') clearAllJournal();
        else if (action === 'rules') resetRules();
        else if (action === 'board') clearBoard();
        else if (action === 'all') clearEverything();
      });
    });
  }

  function renderRulesTab() {
    const r = rules || defaultRules();
    const updated = r.updated_at ? new Date(r.updated_at).toLocaleString('sv-SE', { timeZone: 'Europe/Stockholm' }) : 'never';
    return `
      <div class="rules-panel">
        <div class="section-label">ENFORCEABLE LIMITS <span class="section-hint">— checked against your trades on the Dashboard as a passive flag</span></div>
        <div class="rules-grid">
          <label class="rules-field">
            <span>Daily loss limit ($)</span>
            <input type="number" id="rule-dailyLossLimit" min="0" step="1" placeholder="e.g. 500" value="${r.dailyLossLimit ?? ''}">
          </label>
          <label class="rules-field">
            <span>Max trades per day</span>
            <input type="number" id="rule-maxTradesPerDay" min="0" step="1" placeholder="e.g. 5" value="${r.maxTradesPerDay ?? ''}">
          </label>
          <label class="rules-field">
            <span>Max size per trade (contracts)</span>
            <input type="number" id="rule-maxSizePerTrade" min="0" step="1" placeholder="e.g. 2" value="${r.maxSizePerTrade ?? ''}">
          </label>
          <label class="rules-field">
            <span>Max consecutive losses</span>
            <input type="number" id="rule-maxConsecutiveLosses" min="0" step="1" placeholder="e.g. 3" value="${r.maxConsecutiveLosses ?? ''}">
          </label>
          <label class="rules-field">
            <span>Sessions to trade</span>
            <input type="text" id="rule-sessionsToTrade" placeholder="e.g. London, NY Open" value="${r.sessionsToTrade || ''}">
          </label>
          <label class="rules-field">
            <span>Max time to trade before a break (min)</span>
            <input type="number" id="rule-maxTimeBeforeBreak" min="0" step="1" placeholder="e.g. 90 (then 15 min break)" value="${r.maxTimeBeforeBreak ?? ''}">
          </label>
        </div>

        <div class="section-label">OTHER NOTES</div>
        <textarea id="rule-notes" placeholder="Anything else worth writing down.">${r.notes || ''}</textarea>

        <div class="journal-form-actions" style="margin-top: 4px;">
          <button class="upload-btn" id="rules-save">Save rules</button>
          <div class="rules-updated">Last updated: ${updated}</div>
        </div>
      </div>
    `;
  }

  function wireRulesTab() {
    const saveBtn = root.querySelector('#rules-save');
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        const numOrNull = (id) => {
          const v = root.querySelector(id).value;
          return v === '' ? null : parseFloat(v);
        };
        rules = {
          dailyLossLimit: numOrNull('#rule-dailyLossLimit'),
          maxTradesPerDay: numOrNull('#rule-maxTradesPerDay'),
          maxSizePerTrade: numOrNull('#rule-maxSizePerTrade'),
          maxConsecutiveLosses: numOrNull('#rule-maxConsecutiveLosses'),
          sessionsToTrade: root.querySelector('#rule-sessionsToTrade').value || '',
          maxTimeBeforeBreak: numOrNull('#rule-maxTimeBeforeBreak'),
          notes: root.querySelector('#rule-notes').value || '',
          updated_at: new Date().toISOString()
        };
        await saveRules();
        status = { msg: 'Rules saved.', error: false };
        render();
      });
    }
  }

  function renderSoon(title, desc, phase) {
    return `
      <div class="soon">
        <div class="gauge-face"><div class="gauge-needle"></div></div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="phase">${phase}</div>
      </div>
    `;
  }

    root.querySelectorAll('.nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        status = { msg: '', error: false };
        importSummary = null;
        exportFallback = null;
        clearArmed = null;
        render();
      });
    });

    const zone = root.querySelector('#upload-zone');
    const fileInput = root.querySelector('#file-input');
    const uploadBtn = root.querySelector('#upload-btn');
    if (zone) {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });
      uploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
      });
    }

    root.querySelectorAll('th[data-sortkey]').forEach(th => {
      th.addEventListener('click', () => setSort(th.dataset.sortkey));

    const clearBtn = root.querySelector('#dash-clear');
    if (applyBtn) {
      applyBtn.addEventListener('click', () => {
        dashFrom = root.querySelector('#dash-from').value || '';
        dashTo = root.querySelector('#dash-to').value || '';
        render();
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', () => { dashFrom = ''; dashTo = ''; render(); });
    }

    const tradesApplyBtn = root.querySelector('#trades-apply');
    const tradesClearBtn = root.querySelector('#trades-clear');
    if (tradesApplyBtn) {
      tradesApplyBtn.addEventListener('click', () => {
        tradesFrom = root.querySelector('#trades-from').value || '';
        tradesTo = root.querySelector('#trades-to').value || '';
        render();
      });
    }
    if (tradesClearBtn) {
      tradesClearBtn.addEventListener('click', () => { tradesFrom = ''; tradesTo = ''; render(); });
    }

    root.querySelectorAll('.mood-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.dataset.tradeId;
        const val = sel.value ? parseInt(sel.value, 10) : null;
        const t = trades.find(x => x.id === id);
        if (t) { t.mood = val; await saveTrades(); }
      });
    });

    if (activeTab === 'journal') wireJournalTab();
    if (activeTab === 'board') wireBoardTab();
    if (activeTab === 'rules') wireRulesTab();
    if (activeTab === 'data') wireDataTab();
  }

  loadTrades();
})();
</script>
