<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function() {
  const root = document.getElementById('trim-root');
  let activeTab = 'trades';
  let trades = [];
  let sortKey = 'entered_at';
  let sortDir = 'desc';
  let status = { msg: '', error: false };
  let loading = true;
  let dashFrom = '';
  let dashTo = '';
  let tradesFrom = '';
  let tradesTo = '';
  let journalEntries = [];
  let journalFrom = '';
  let journalTo = '';
  let journalTagFilter = '';
  let journalMistakeFilter = '';
  let journalRulesBrokenOnly = false;
  let journalDraft = null; // set when creating or editing an entry
  let confirmDeleteId = null;
  let rules = null;
  let importSummary = null; // set after an import completes
  let exportFallback = null; // JSON text shown if a download can't be triggered
  let clearFrom = '';
  let clearTo = '';
  let clearArmed = null; // which destructive action is armed: 'range' | 'trades' | 'journal' | 'rules' | 'board' | 'all'
  let boardMarks = {};   // sparse: { 'YYYY-MM-DD': 'g' | 'y' | 'r' }
  let boardComments = {}; // sparse: { 'YYYY-MM-DD': 'free text' }
  let boardPrefs = null;
  let boardFlashDate = null; // date to scroll to and flash on the next board render
  let boardFocusedDate = null; // last clicked/keyboard-focused day, drives the comment box (not hover)

  const STORAGE_KEY = 'trim:trades:all';
  const JOURNAL_KEY = 'trim:journal:entries';
  const RULES_KEY = 'trim:rules:config';
  const BOARD_KEY = 'trim:board:marks';
  const BOARD_PREFS_KEY = 'trim:board:prefs';
  const BOARD_COMMENTS_KEY = 'trim:board:comments';
  const BACKUP_VERSION = 2;

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false; // e.g. quota exceeded, or localStorage unavailable (private mode)
    }
  }

  const ADHERENCE_RULES = [
    { id: 'stationSetup',    label: 'Trading Station has been setup to meet today\'s Trading rules prior to session start', emphasis: true },
    { id: 'onlyPlanSetups',  label: 'Only traded the setups I planned for today' },
    { id: 'respectedOpen',   label: 'Respected the no-trade window at the open' },
    { id: 'stoppedAtEnd',    label: 'Stopped taking new trades at my session end time' },
    { id: 'noRevenge',       label: 'Did not revenge trade after a loss' },
    { id: 'tookBreak',       label: 'Took the mandatory break after consecutive losses' },
    { id: 'sizeInPlan',      label: 'Stayed within my max size per trade' },
    { id: 'withinLossLimit', label: 'Stayed within my daily loss limit' },
    { id: 'stopHonoured',    label: 'Honoured every planned stop — never moved one' }
  ];
  const EMOTION_TAGS = ['Disciplined', 'Patient', 'Confident', 'Distracted', 'Anxious', 'Frustrated', 'Euphoric'];
  const MISTAKE_TAGS = ['Revenge trade', 'FOMO', 'Overtrading', 'Hesitation', 'Early exit', 'Moved stop', 'Oversized', 'No stop', 'Off-plan setup'];
  const COMBINE_COST = 120; // daily cost of the trading combine — the financial target

  function defaultRules() {
    return {
      dailyLossLimit: 150,
      maxTradesPerDay: 5,
      maxSizePerTrade: 2,
      maxConsecutiveLosses: 2,
      sessionsToTrade: 'NY Open',
      maxTimeBeforeBreak: 60,
      notes: 'Opening 15-30 mins Rage Trade @ NY Open. No Trading from work laptop. Make sure to let go of work/family. Trading is a performance sport. Quick in/out market will crush you, stay greatful for what you can get today and leave.',
      updated_at: null
    };
  }

  function emptyDraft() {
    return {
      id: null, date: todayLocalStr(), mood: null, tags: [], text: '',
      adherence: {}, emotionTags: [], mistakeTags: [], dayRating: null,
      targetHit: false, targetRating: null
    };
  }

  function normalizeEntry(e) {
    return {
      ...e,
      adherence: e.adherence || {},
      emotionTags: e.emotionTags || [],
      mistakeTags: e.mistakeTags || [],
      dayRating: e.dayRating != null ? e.dayRating : null,
      targetHit: !!e.targetHit,
      targetRating: e.targetRating != null ? e.targetRating : null
    };
  }

  function parseTimestamp(str) {
    // e.g. "07/01/2026 13:11:11 +02:00"
    const m = str.trim().match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2}) ([+-]\d{2}):(\d{2})$/);
    if (!m) return null;
    const [, mo, d, y, h, mi, s, offH, offM] = m;
    const iso = `${y}-${mo}-${d}T${h}:${mi}:${s}${offH}:${offM}`;
    const dt = new Date(iso);
    return isNaN(dt.getTime()) ? null : dt;
  }

  function fmtLocalDate(dt) {
    return dt.toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });
  }
  function fmtLocalTime(dt) {
    return dt.toLocaleTimeString('sv-SE', { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function fmtDuration(dt1, dt2) {
    const secs = Math.round((dt2 - dt1) / 1000);
    return fmtSeconds(secs);
  }
  function fmtSeconds(secs) {
    secs = Math.round(secs);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  function fmtMoney(n) {
    const sign = n < 0 ? '-' : '';
    return sign + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function todayLocalStr() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });
  }

  /* ---------- Nasdaq trading calendar ----------
     All arithmetic is done in UTC so daylight-saving shifts can never move a date. */

  const BOARD_START = '2026-08-01';
  const BOARD_END = '2031-07-31';
  const BOARD_EXPECTED_DAYS = 1255; // guard: regressions in the holiday rules show up here
  const BOARD_CYCLE = ['g', 'y', 'r', 'b'];
  const BOARD_LABELS = { g: 'Followed my plan', y: 'Minor deviation', r: 'Broke my rules', b: "Didn't trade" };
  // 'b' is a deliberate judgement, not a gap: it sits outside the discipline
  // percentage and is stepped over by streaks rather than breaking them.
  const BOARD_TRADED = ['g', 'y', 'r'];
  const WD_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MO_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function utcFromISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }
  function isoFromUTC(dt) {
    return dt.toISOString().slice(0, 10);
  }
  function addDaysUTC(dt, n) {
    return new Date(dt.getTime() + n * 86400000);
  }

  // Easter Sunday, anonymous Gregorian algorithm.
  function easterSundayUTC(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(Date.UTC(y, month - 1, day));
  }

  function nthWeekdayUTC(y, month, weekday, n) {
    const first = new Date(Date.UTC(y, month - 1, 1));
    const offset = (weekday - first.getUTCDay() + 7) % 7;
    return new Date(Date.UTC(y, month - 1, 1 + offset + 7 * (n - 1)));
  }
  function lastWeekdayUTC(y, month, weekday) {
    const last = new Date(Date.UTC(y, month, 0)); // day 0 of the next month
    return addDaysUTC(last, -((last.getUTCDay() - weekday + 7) % 7));
  }
  // Saturday -> preceding Friday, Sunday -> following Monday.
  function observedUTC(dt) {
    const wd = dt.getUTCDay();
    if (wd === 6) return addDaysUTC(dt, -1);
    if (wd === 0) return addDaysUTC(dt, 1);
    return dt;
  }

  function marketHolidaySet(y) {
    const out = new Set();
    const add = dt => out.add(isoFromUTC(dt));

    // A 1 Jan that falls on a Saturday is NOT pulled back to 31 Dec — the exchange
    // does not close on the last trading day of the preceding year. Every other
    // Saturday holiday is observed on the preceding Friday.
    const newYear = new Date(Date.UTC(y, 0, 1));
    if (newYear.getUTCDay() !== 6) add(observedUTC(newYear));

    add(nthWeekdayUTC(y, 1, 1, 3));            // Martin Luther King Jr. Day
    add(nthWeekdayUTC(y, 2, 1, 3));            // Washington's Birthday
    add(addDaysUTC(easterSundayUTC(y), -2));   // Good Friday
    add(lastWeekdayUTC(y, 5, 1));              // Memorial Day
    add(observedUTC(new Date(Date.UTC(y, 5, 19))));  // Juneteenth
    add(observedUTC(new Date(Date.UTC(y, 6, 4))));   // Independence Day
    add(nthWeekdayUTC(y, 9, 1, 1));            // Labor Day
    add(nthWeekdayUTC(y, 11, 4, 4));           // Thanksgiving
    add(observedUTC(new Date(Date.UTC(y, 11, 25)))); // Christmas
    return out;
  }

  // Weekdays between the two dates that the Nasdaq is open, as 'YYYY-MM-DD' strings.
  // `closures` covers unscheduled closures (a state funeral, weather) that no rule predicts.
  function nasdaqTradingDays(startISO, endISO, closures) {
    const start = utcFromISO(startISO);
    const end = utcFromISO(endISO);
    const extra = new Set(closures || []);
    const holidays = new Set();
    for (let y = start.getUTCFullYear(); y <= end.getUTCFullYear(); y++) {
      marketHolidaySet(y).forEach(d => holidays.add(d));
    }
    const out = [];
    for (let dt = start; dt <= end; dt = addDaysUTC(dt, 1)) {
      const wd = dt.getUTCDay();
      if (wd === 0 || wd === 6) continue;
      const iso = isoFromUTC(dt);
      if (holidays.has(iso) || extra.has(iso)) continue;
      out.push(iso);
    }
    return out;
  }

  function defaultBoardPrefs() {
    return { density: 'm', closures: [] };
  }

  // The board's day list plus everything the renderer needs, rebuilt only when
  // the closure overrides change.
  let boardDaysCache = null;
  function boardDays() {
    const closures = (boardPrefs && boardPrefs.closures) || [];
    const key = closures.join(',');
    if (boardDaysCache && boardDaysCache.key === key) return boardDaysCache.days;
    const days = nasdaqTradingDays(BOARD_START, BOARD_END, closures);
    boardDaysCache = { key, days };
    return days;
  }

  // Five Aug->Jul bands. Each band restarts the ribbon on a fresh row.
  function boardBands() {
    const days = boardDays();
    const bands = [];
    for (let i = 0; i < 5; i++) {
      const from = `${2026 + i}-08-01`;
      const to = `${2027 + i}-07-31`;
      bands.push({
        index: i + 1,
        from, to,
        label: `${MO_NAMES[7]} ${2026 + i} → ${MO_NAMES[6]} ${2027 + i}`,
        days: days.filter(d => d >= from && d <= to)
      });
    }
    return bands;
  }

  function fmtBoardDate(iso) {
    const dt = utcFromISO(iso);
    return `${WD_NAMES[dt.getUTCDay()]} ${dt.getUTCDate()} ${MO_NAMES[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
  }

  function saveBoard() {
    if (!saveJSON(BOARD_KEY, boardMarks)) {
      status = { msg: 'Could not save to storage. Board marks may not persist.', error: true };
    }
  }
  function saveBoardPrefs() {
    saveJSON(BOARD_PREFS_KEY, boardPrefs);
  }
  function saveBoardComments() {
    if (!saveJSON(BOARD_COMMENTS_KEY, boardComments)) {
      status = { msg: 'Could not save comment to storage. It may not persist.', error: true };
    }
  }

  function loadTrades() {
    trades = loadJSON(STORAGE_KEY, []);
    journalEntries = loadJSON(JOURNAL_KEY, []).map(normalizeEntry);
    rules = { ...defaultRules(), ...loadJSON(RULES_KEY, {}) };
    boardMarks = loadJSON(BOARD_KEY, {}) || {};
    boardComments = loadJSON(BOARD_COMMENTS_KEY, {}) || {};
    boardPrefs = { ...defaultBoardPrefs(), ...loadJSON(BOARD_PREFS_KEY, {}) };
    if (!Array.isArray(boardPrefs.closures)) boardPrefs.closures = [];
    loading = false;
    render();
  }

  function saveTrades() {
    if (!saveJSON(STORAGE_KEY, trades)) {
      status = { msg: 'Could not save to storage. Data may not persist.', error: true };
    }
  }

  function saveJournal() {
    if (!saveJSON(JOURNAL_KEY, journalEntries)) {
      status = { msg: 'Could not save journal to storage. Data may not persist.', error: true };
    }
  }

  function saveRules() {
    if (!saveJSON(RULES_KEY, rules)) {
      status = { msg: 'Could not save rules to storage. Data may not persist.', error: true };
    }
  }

  /* ---------- export / import ---------- */

  function buildBackupPayload() {
    return {
      app: 'trim',
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      trades,
      journalEntries,
      rules: rules || defaultRules(),
      boardMarks,
      boardComments,
      boardPrefs: boardPrefs || defaultBoardPrefs()
    };
  }

  function exportData() {
    exportFallback = null;
    const json = JSON.stringify(buildBackupPayload(), null, 2);
    try {
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trim-backup-${todayLocalStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status = { msg: 'Backup downloaded.', error: false };
    } catch (e) {
      exportFallback = json;
      status = { msg: 'Could not trigger a download here — copy the backup text below instead.', error: true };
    }
    render();
  }

  function handleBackupFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.json')) {
      status = { msg: 'Please upload a .json backup file.', error: true };
      importSummary = null;
      render();
      return;
    }
    const reader = new FileReader();
    reader.onload = async () => {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (e) {
        status = { msg: 'Could not read that file as a TRIM backup.', error: true };
        importSummary = null;
        render();
        return;
      }
      if (!data || typeof data !== 'object' || (!data.trades && !data.journalEntries && !data.rules && !data.boardMarks)) {
        status = { msg: 'That file does not look like a TRIM backup.', error: true };
        importSummary = null;
        render();
        return;
      }
      if (data.app && data.app !== 'trim') {
        status = { msg: `That file is a backup from "${data.app}", not TRIM.`, error: true };
        importSummary = null;
        render();
        return;
      }

      let added = 0, skipped = 0;
      if (Array.isArray(data.trades)) {
        const existingIds = new Set(trades.map(t => t.id));
        for (const t of data.trades) {
          if (!t || !t.id) continue;
          if (existingIds.has(t.id)) { skipped++; continue; }
          trades.push(t);
          existingIds.add(t.id);
          added++;
        }
        await saveTrades();
      }

      let journalAdded = 0, journalSkipped = 0;
      if (Array.isArray(data.journalEntries)) {
        const existingIds = new Set(journalEntries.map(e => e.id));
        for (const e of data.journalEntries) {
          if (!e || !e.id) continue;
          if (existingIds.has(e.id)) { journalSkipped++; continue; }
          journalEntries.push(normalizeEntry(e));
          existingIds.add(e.id);
          journalAdded++;
        }
        await saveJournal();
      }

      let rulesReplaced = false;
      if (data.rules && typeof data.rules === 'object') {
        rules = { ...defaultRules(), ...data.rules };
        await saveRules();
        rulesReplaced = true;
      }

      // Board marks: a day already marked here wins, so importing a backup can
      // fill gaps without silently overwriting judgements made since the export.
      let boardAdded = 0, boardSkipped = 0;
      if (data.boardMarks && typeof data.boardMarks === 'object') {
        for (const [date, mark] of Object.entries(data.boardMarks)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !BOARD_CYCLE.includes(mark)) continue;
          if (boardMarks[date]) { boardSkipped++; continue; }
          boardMarks[date] = mark;
          boardAdded++;
        }
        saveBoard();
      }
      // Comments: same gap-fill rule as marks — an existing comment for a day wins.
      let commentsAdded = 0, commentsSkipped = 0;
      if (data.boardComments && typeof data.boardComments === 'object') {
        for (const [date, text] of Object.entries(data.boardComments)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || typeof text !== 'string' || !text.trim()) continue;
          if (boardComments[date]) { commentsSkipped++; continue; }
          boardComments[date] = text;
          commentsAdded++;
        }
        saveBoardComments();
      }
      if (data.boardPrefs && Array.isArray(data.boardPrefs.closures)) {
        const merged = new Set([...(boardPrefs.closures || []), ...data.boardPrefs.closures]);
        boardPrefs.closures = [...merged].sort();
        boardDaysCache = null;
        saveBoardPrefs();
      }

      importSummary = { added, skipped, journalAdded, journalSkipped, rulesReplaced, boardAdded, boardSkipped, commentsAdded, commentsSkipped };
      status = { msg: 'Import complete.', error: false };
      render();
    };
    reader.onerror = () => {
      status = { msg: 'Could not read that file.', error: true };
      importSummary = null;
      render();
    };
    reader.readAsText(file);
  }

  /* ---------- clear data ---------- */

  function tradesInClearRange() {
    return trades.filter(t => {
      const d = tradeLocalDateStr(t);
      if (clearFrom && d < clearFrom) return false;
      if (clearTo && d > clearTo) return false;
      return true;
    });
  }

  function journalInClearRange() {
    return journalEntries.filter(e => {
      if (clearFrom && e.date < clearFrom) return false;
      if (clearTo && e.date > clearTo) return false;
      return true;
    });
  }

  function afterClear(msg) {
    status = { msg, error: false };
    clearArmed = null;
    render();
  }

  function clearByRange() {
    const rangeIds = new Set(tradesInClearRange().map(t => t.id));
    const journalIds = new Set(journalInClearRange().map(e => e.id));
    trades = trades.filter(t => !rangeIds.has(t.id));
    journalEntries = journalEntries.filter(e => !journalIds.has(e.id));
    saveTrades();
    saveJournal();
    status = { msg: `Cleared ${rangeIds.size} trade${rangeIds.size === 1 ? '' : 's'} and ${journalIds.size} journal entr${journalIds.size === 1 ? 'y' : 'ies'} in range.`, error: false };
    clearArmed = null;
    clearFrom = '';
    clearTo = '';
    render();
  }

  function clearAllTrades() {
    trades = [];
    saveTrades();
    afterClear('All trades cleared.');
  }

  function clearAllJournal() {
    journalEntries = [];
    saveJournal();
    afterClear('All journal entries cleared.');
  }

  function resetRules() {
    rules = defaultRules();
    saveRules();
    afterClear('Rules reset to defaults.');
  }

  function clearBoard() {
    boardMarks = {};
    boardComments = {};
    boardFocusedDate = null;
    saveBoard();
    saveBoardComments();
    afterClear('All board marks and comments cleared.');
  }

  function clearEverything() {
    trades = [];
    journalEntries = [];
    rules = defaultRules();
    boardMarks = {};
    boardComments = {};
    boardFocusedDate = null;
    boardPrefs = defaultBoardPrefs();
    boardDaysCache = null;
    saveTrades();
    saveJournal();
    saveRules();
    saveBoard();
    saveBoardComments();
    saveBoardPrefs();
    afterClear('All TRIM data cleared.');
  }

  function normalizeRow(row) {
    const enteredAt = parseTimestamp(row.EnteredAt || '');
    const exitedAt = parseTimestamp(row.ExitedAt || '');
    if (!enteredAt || !exitedAt || !row.Id) return null;
    const pnl = parseFloat(row.PnL);
    const fees = parseFloat(row.Fees || 0);
    const commissions = parseFloat(row.Commissions || 0);
    if (isNaN(pnl)) return null;
    return {
      id: String(row.Id),
      contract: row.ContractName || '',
      entered_at: enteredAt.toISOString(),
      exited_at: exitedAt.toISOString(),
      entry_price: parseFloat(row.EntryPrice),
      exit_price: parseFloat(row.ExitPrice),
      size: parseInt(row.Size, 10) || 0,
      type: row.Type || '',
      pnl_gross: pnl,
      fees: isNaN(fees) ? 0 : fees,
      commissions: isNaN(commissions) ? 0 : commissions,
      pnl_net: pnl - (isNaN(fees) ? 0 : fees) - (isNaN(commissions) ? 0 : commissions),
      duration_seconds: Math.round((exitedAt - enteredAt) / 1000),
      mood: null
    };
  }

  function handleFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) {
      status = { msg: 'Please upload a .csv file.', error: true };
      render();
      return;
    }
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (results) => {
        const rows = results.data;
        const existingIds = new Set(trades.map(t => t.id));
        let added = 0, skipped = 0, invalid = 0;
        for (const row of rows) {
          const norm = normalizeRow(row);
          if (!norm) { invalid++; continue; }
          if (existingIds.has(norm.id)) { skipped++; continue; }
          trades.push(norm);
          existingIds.add(norm.id);
          added++;
        }
        await saveTrades();
        status = {
          msg: `Imported ${added} new trade${added === 1 ? '' : 's'}.` +
               (skipped ? ` ${skipped} duplicate${skipped === 1 ? '' : 's'} skipped.` : '') +
               (invalid ? ` ${invalid} row${invalid === 1 ? '' : 's'} could not be read.` : ''),
          error: added === 0 && (skipped === 0)
        };
        render();
      },
      error: (err) => {
        status = { msg: 'Could not parse file: ' + err.message, error: true };
        render();
      }
    });
  }

  // Duration-by-outcome and win-rate-by-side breakdowns shared by the Trades
  // tab (all trades) and the Dashboard tab (date-filtered trades).
  function computeDurationAndSideStats(list) {
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const winDurations = list.filter(t => t.pnl_net > 0).map(t => t.duration_seconds);
    const lossDurations = list.filter(t => t.pnl_net < 0).map(t => t.duration_seconds);

    const longs = list.filter(t => (t.type || '').toLowerCase() === 'long');
    const shorts = list.filter(t => (t.type || '').toLowerCase() === 'short');

    return {
      avgDurationWin: avg(winDurations),
      avgDurationLoss: avg(lossDurations),
      longsCount: longs.length,
      shortsCount: shorts.length,
      winRateLong: longs.length ? (longs.filter(t => t.pnl_net > 0).length / longs.length) * 100 : null,
      winRateShort: shorts.length ? (shorts.filter(t => t.pnl_net > 0).length / shorts.length) * 100 : null
    };
  }

  function computeStats(list) {
    list = list || trades;
    const n = list.length;
    if (n === 0) return null;
    const grossTotal = list.reduce((s, t) => s + t.pnl_gross, 0);
    const netTotal = list.reduce((s, t) => s + t.pnl_net, 0);
    const costTotal = list.reduce((s, t) => s + t.fees + t.commissions, 0);
    const wins = list.filter(t => t.pnl_net > 0).length;
    const winRate = (wins / n) * 100;
    const costDrag = grossTotal !== 0 ? (costTotal / Math.abs(grossTotal)) * 100 : 0;

    return {
      n, grossTotal, netTotal, costTotal, winRate, costDrag,
      ...computeDurationAndSideStats(list)
    };
  }

  function tradeLocalDateStr(t) {
    return new Date(t.entered_at).toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' }); // YYYY-MM-DD
  }

  function filterTradesForDashboard() {
    return trades.filter(t => {
      const d = tradeLocalDateStr(t);
      if (dashFrom && d < dashFrom) return false;
      if (dashTo && d > dashTo) return false;
      return true;
    });
  }

  function filterTradesForTradesTab() {
    return trades.filter(t => {
      const d = tradeLocalDateStr(t);
      if (tradesFrom && d < tradesFrom) return false;
      if (tradesTo && d > tradesTo) return false;
      return true;
    });
  }

  function computeDashboardStats(list) {
    const n = list.length;
    if (n === 0) return null;
    const grossTotal = list.reduce((s, t) => s + t.pnl_gross, 0);
    const netTotal = list.reduce((s, t) => s + t.pnl_net, 0);
    const costTotal = list.reduce((s, t) => s + t.fees + t.commissions, 0);
    const winners = list.filter(t => t.pnl_net > 0);
    const losers = list.filter(t => t.pnl_net < 0);
    const scratch = n - winners.length - losers.length;
    const winRate = (winners.length / n) * 100;
    const sumWin = winners.reduce((s, t) => s + t.pnl_net, 0);
    const sumLoss = losers.reduce((s, t) => s + t.pnl_net, 0); // negative
    const avgWin = winners.length ? sumWin / winners.length : 0;
    const avgLoss = losers.length ? sumLoss / losers.length : 0; // negative
    const profitFactor = sumLoss !== 0 ? Math.abs(sumWin / sumLoss) : (sumWin > 0 ? Infinity : 0);
    const winLossRatio = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : (avgWin > 0 ? Infinity : 0);
    const costDrag = grossTotal !== 0 ? (costTotal / Math.abs(grossTotal)) * 100 : 0;
    return {
      n, grossTotal, netTotal, costTotal, winRate, winners: winners.length,
      losers: losers.length, scratch, avgWin, avgLoss, profitFactor, winLossRatio, costDrag,
      ...computeDurationAndSideStats(list)
    };
  }

  function groupByField(list, keyFn) {
    const groups = {};
    for (const t of list) {
      const key = keyFn(t);
      if (!groups[key]) groups[key] = [];
      groups[key].push(t);
    }
    return Object.entries(groups).map(([key, items]) => {
      const netTotal = items.reduce((s, t) => s + t.pnl_net, 0);
      const grossTotal = items.reduce((s, t) => s + t.pnl_gross, 0);
      const wins = items.filter(t => t.pnl_net > 0).length;
      return {
        key, count: items.length, netTotal, grossTotal,
        winRate: (wins / items.length) * 100
      };
    });
  }

  function localHour(t) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Stockholm', hour: 'numeric', hourCycle: 'h23' }).format(new Date(t.entered_at));
  }
  function localWeekday(t) {
    return new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Stockholm', weekday: 'short' }).format(new Date(t.entered_at));
  }

  function groupByDaySorted(list) {
    const byDay = {};
    for (const t of list) {
      const day = tradeLocalDateStr(t);
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(t);
    }
    for (const day in byDay) byDay[day].sort((a, b) => new Date(a.entered_at) - new Date(b.entered_at));
    return byDay;
  }

  function computeSessionSegments(list) {
    const byDay = groupByDaySorted(list);
    const segmentMap = new Map();
    for (const day in byDay) {
      const dayTrades = byDay[day];
      const start = new Date(dayTrades[0].entered_at).getTime();
      const end = Math.max(...dayTrades.map(t => new Date(t.exited_at).getTime()));
      const span = end - start;
      for (const t of dayTrades) {
        const frac = span > 0 ? (new Date(t.entered_at).getTime() - start) / span : 0;
        let seg;
        if (frac < 0.2) seg = 'First 20%';
        else if (frac > 0.8) seg = 'Last 20%';
        else seg = 'Middle 60%';
        segmentMap.set(t.id, seg);
      }
    }
    return segmentMap;
  }

  function computeStreaks(list) {
    const byDay = groupByDaySorted(list);
    let maxLen = 0, maxLenCost = 0;
    let worstCost = 0, worstCostLen = 0;
    let streaksOf3Plus = 0;
    for (const day in byDay) {
      let curLen = 0, curSum = 0;
      const closeStreak = () => {
        if (curLen >= 2) {
          if (curLen >= 3) streaksOf3Plus++;
          if (curLen > maxLen) { maxLen = curLen; maxLenCost = curSum; }
          if (curSum < worstCost) { worstCost = curSum; worstCostLen = curLen; }
        }
        curLen = 0; curSum = 0;
      };
      for (const t of byDay[day]) {
        if (t.pnl_net < 0) { curLen++; curSum += t.pnl_net; }
        else { closeStreak(); }
      }
      closeStreak();
    }
    return { maxLen, maxLenCost, worstCost, worstCostLen, streaksOf3Plus };
  }

  function computeSequentialStats(list) {
    const byDay = groupByDaySorted(list);
    const gaps = { win: [], loss: [], scratch: [] };
    const sizes = { win: [], loss: [], scratch: [] };
    for (const day in byDay) {
      const dayTrades = byDay[day];
      for (let i = 0; i < dayTrades.length - 1; i++) {
        const prev = dayTrades[i], next = dayTrades[i + 1];
        const gapSec = Math.max(0, (new Date(next.entered_at) - new Date(prev.exited_at)) / 1000);
        const outcome = prev.pnl_net < 0 ? 'loss' : (prev.pnl_net > 0 ? 'win' : 'scratch');
        gaps[outcome].push(gapSec);
        sizes[outcome].push(next.size);
      }
    }
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    return {
      avgGapAfterWin: avg(gaps.win), avgGapAfterLoss: avg(gaps.loss),
      avgSizeAfterWin: avg(sizes.win), avgSizeAfterLoss: avg(sizes.loss),
      nAfterWin: gaps.win.length, nAfterLoss: gaps.loss.length
    };
  }

  function avgDurationByOutcome(list) {
    const wins = list.filter(t => t.pnl_net > 0).map(t => t.duration_seconds);
    const losses = list.filter(t => t.pnl_net < 0).map(t => t.duration_seconds);
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    return { avgDurationWin: avg(wins), avgDurationLoss: avg(losses) };
  }

  function computeDayAggregates(list) {
    const byDay = groupByDaySorted(list);
    return Object.keys(byDay).sort().map(day => {
      const dayTrades = byDay[day];
      const netTotal = dayTrades.reduce((s, t) => s + t.pnl_net, 0);
      const maxSize = Math.max(...dayTrades.map(t => t.size));
      let curLossStreak = 0, maxLossStreak = 0;
      for (const t of dayTrades) {
        if (t.pnl_net < 0) { curLossStreak++; maxLossStreak = Math.max(maxLossStreak, curLossStreak); }
        else curLossStreak = 0;
      }
      return { date: day, count: dayTrades.length, netTotal, maxSize, maxLossStreak };
    });
  }

  function checkDayViolations(dayAgg, r) {
    const violations = [];
    if (r.dailyLossLimit != null && dayAgg.netTotal < -Math.abs(r.dailyLossLimit)) {
      violations.push(`Daily loss limit: net ${fmtMoney(dayAgg.netTotal)} vs limit -${fmtMoney(Math.abs(r.dailyLossLimit))}`);
    }
    if (r.maxTradesPerDay != null && dayAgg.count > r.maxTradesPerDay) {
      violations.push(`Max trades: ${dayAgg.count} vs limit ${r.maxTradesPerDay}`);
    }
    if (r.maxSizePerTrade != null && dayAgg.maxSize > r.maxSizePerTrade) {
      violations.push(`Size limit: used ${dayAgg.maxSize} vs limit ${r.maxSizePerTrade}`);
    }
    if (r.maxConsecutiveLosses != null && dayAgg.maxLossStreak > r.maxConsecutiveLosses) {
      violations.push(`Consecutive losses: ${dayAgg.maxLossStreak} vs limit ${r.maxConsecutiveLosses}`);
    }
    return violations;
  }

  function hasAnyEnforceableRule(r) {
    return r.dailyLossLimit != null || r.maxTradesPerDay != null || r.maxSizePerTrade != null || r.maxConsecutiveLosses != null;
  }

  function sortTrades(list) {
    const copy = [...list];
    copy.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'entered_at' || sortKey === 'exited_at') {
        av = new Date(av).getTime(); bv = new Date(bv).getTime();
      }
      if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return copy;
  }

  function setSort(key) {
    if (sortKey === key) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortKey = key; sortDir = 'desc'; }
    render();
  }

  function renderStatRow(stats) {
    if (!stats) return '';
    const netClass = stats.netTotal > 0 ? 'positive' : (stats.netTotal < 0 ? 'negative' : 'neutral');
    const grossClass = stats.grossTotal > 0 ? 'positive' : (stats.grossTotal < 0 ? 'negative' : 'neutral');
    const ticks = Array.from({length: 9}).map(() => '<div></div>').join('');
    return `
      <div class="stat-row" style="grid-template-columns: repeat(6, 1fr);">
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Trades logged</div>
          <div class="stat-value neutral">${stats.n}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Gross P&amp;L</div>
          <div class="stat-value ${grossClass}">${fmtMoney(stats.grossTotal)}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Net P&amp;L</div>
          <div class="stat-value ${netClass}">${fmtMoney(stats.netTotal)}</div>
          <div class="stat-sub">costs ${fmtMoney(stats.costTotal)}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Total cost</div>
          <div class="stat-value negative">${fmtMoney(stats.costTotal)}</div>
          <div class="stat-sub">fees + commissions</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Win rate (net)</div>
          <div class="stat-value neutral">${stats.winRate.toFixed(1)}%</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Cost drag</div>
          <div class="stat-value neutral">${stats.costDrag.toFixed(1)}%</div>
          <div class="stat-sub">of gross P&amp;L</div>
        </div>
      </div>
      <div class="stat-row" style="grid-template-columns: repeat(4, 1fr);">
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Avg duration (win)</div>
          <div class="stat-value neutral">${stats.avgDurationWin !== null ? fmtSeconds(stats.avgDurationWin) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Avg duration (loss)</div>
          <div class="stat-value neutral">${stats.avgDurationLoss !== null ? fmtSeconds(stats.avgDurationLoss) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Win rate (long)</div>
          <div class="stat-value neutral">${stats.winRateLong !== null ? stats.winRateLong.toFixed(1) + '%' : '—'}</div>
          <div class="stat-sub">${stats.longsCount} trade${stats.longsCount === 1 ? '' : 's'}</div>
        </div>
        <div class="stat-card">
          <div class="ticks">${ticks}</div>
          <div class="stat-label">Win rate (short)</div>
          <div class="stat-value neutral">${stats.winRateShort !== null ? stats.winRateShort.toFixed(1) + '%' : '—'}</div>
          <div class="stat-sub">${stats.shortsCount} trade${stats.shortsCount === 1 ? '' : 's'}</div>
        </div>
      </div>
    `;
  }

  function renderTable(list) {
    const sorted = sortTrades(list || trades);
    const cols = [
      ['entered_at', 'Date'], ['entered_at', 'Time'], ['contract', 'Contract'],
      ['type', 'Side'], ['size', 'Size'], ['entry_price', 'Entry'], ['exit_price', 'Exit'],
      ['duration_seconds', 'Dur'], ['pnl_gross', 'Gross'], ['fees', 'Fees'], ['commissions', 'Comm'], ['pnl_net', 'Net'], ['mood', 'Mood']
    ];
    const headerHtml = cols.map(([key, label], i) => {
      const isSorted = sortKey === key && label !== 'Time';
      const sortable = key !== 'mood';
      return `<th class="${isSorted ? 'sorted' : ''}" ${sortable ? `data-sortkey="${key}"` : ''} data-idx="${i}">${label}${isSorted ? (sortDir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`;
    }).join('');

    const moodOptions = (t) => {
      let opts = `<option value="">–</option>`;
      for (let n = 1; n <= 10; n++) {
        opts += `<option value="${n}" ${t.mood === n ? 'selected' : ''}>${n}</option>`;
      }
      return opts;
    };

    const rows = sorted.map(t => {
      const entered = new Date(t.entered_at);
      const exited = new Date(t.exited_at);
      return `
        <tr>
          <td>${fmtLocalDate(entered)}</td>
          <td>${fmtLocalTime(entered)}</td>
          <td>${t.contract}</td>
          <td><span class="side-tag ${t.type.toLowerCase()}">${t.type}</span></td>
          <td>${t.size}</td>
          <td>${t.entry_price}</td>
          <td>${t.exit_price}</td>
          <td>${fmtDuration(entered, exited)}</td>
          <td class="${t.pnl_gross >= 0 ? 'pos' : 'neg'}">${fmtMoney(t.pnl_gross)}</td>
          <td>${fmtMoney(t.fees)}</td>
          <td>${fmtMoney(t.commissions)}</td>
          <td class="${t.pnl_net >= 0 ? 'pos' : 'neg'}">${fmtMoney(t.pnl_net)}</td>
          <td><select class="mood-select" data-trade-id="${t.id}">${moodOptions(t)}</select></td>
        </tr>
      `;
    }).join('');

    return `
      <div class="table-wrap">
        <table>
          <thead><tr>${headerHtml}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function renderTrades() {
    const filtered = filterTradesForTradesTab();
    const stats = computeStats(filtered);
    const filterBar = `
      <div class="filter-bar">
        <label>FROM <input type="date" id="trades-from" value="${tradesFrom}"></label>
        <label>TO <input type="date" id="trades-to" value="${tradesTo}"></label>
        <button class="filter-btn" id="trades-apply">Apply</button>
        <button class="filter-btn ghost" id="trades-clear">Clear</button>
        <div class="filter-count">${filtered.length} of ${trades.length} trades</div>
      </div>
    `;
    return `
      <div class="upload-zone" id="upload-zone">
        <div class="icon-line">&#9650; DROP CSV OR SELECT FILE</div>
        <div class="sub">Imports your trade export. Existing trades are matched by ID — re-uploading is safe.</div>
        <button class="upload-btn" id="upload-btn">Select CSV</button>
        <input type="file" id="file-input" accept=".csv" style="display:none;">
        ${status.msg ? `<div class="upload-status ${status.error ? 'error' : ''}">${status.msg}</div>` : ''}
      </div>
      ${trades.length === 0 ? '' : filterBar}
      ${stats ? renderStatRow(stats) : ''}
      ${trades.length === 0
        ? `<div class="empty"><div class="big">NO TRADES LOGGED YET</div>Upload a CSV export to begin.</div>`
        : (filtered.length === 0
          ? `<div class="empty"><div class="big">NO TRADES IN RANGE</div>Adjust the date filter above.</div>`
          : renderTable(filtered))}
    `;
  }

  function statCard(ticks, label, value, cls, sub) {
    return `
      <div class="stat-card">
        <div class="ticks">${ticks}</div>
        <div class="stat-label">${label}</div>
        <div class="stat-value ${cls || 'neutral'}">${value}</div>
        ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
      </div>
    `;
  }

  function renderBarGroup(rows, labelFmt) {
    if (rows.length === 0) return `<div class="empty" style="padding:24px;">No data in range.</div>`;
    const maxAbs = Math.max(...rows.map(r => Math.abs(r.netTotal)), 1);
    return rows.map(r => {
      const pct = Math.max((Math.abs(r.netTotal) / maxAbs) * 100, 2);
      const positive = r.netTotal >= 0;
      return `
        <div class="bar-row">
          <div class="bar-label">${labelFmt(r.key)}</div>
          <div class="bar-track">
            <div class="bar-fill ${positive ? 'pos' : 'neg'}" style="width:${pct}%"></div>
          </div>
          <div class="bar-value ${positive ? 'pos' : 'neg'}">${fmtMoney(r.netTotal)}</div>
          <div class="bar-meta">${r.count} trades · ${r.winRate.toFixed(0)}% win</div>
        </div>
      `;
    }).join('');
  }

  function renderDashboardTab() {
    const filtered = filterTradesForDashboard();
    const d = computeDashboardStats(filtered);

    const filterBar = `
      <div class="filter-bar">
        <label>FROM <input type="date" id="dash-from" value="${dashFrom}"></label>
        <label>TO <input type="date" id="dash-to" value="${dashTo}"></label>
        <button class="filter-btn" id="dash-apply">Apply</button>
        <button class="filter-btn ghost" id="dash-clear">Clear</button>
        <div class="filter-count">${filtered.length} of ${trades.length} trades</div>
      </div>
    `;

    if (!d) {
      return filterBar + `<div class="empty"><div class="big">NO TRADES IN RANGE</div>Adjust the date filter or import trades on the Trades tab.</div>`;
    }

    const netClass = d.netTotal > 0 ? 'positive' : (d.netTotal < 0 ? 'negative' : 'neutral');
    const grossClass = d.grossTotal > 0 ? 'positive' : (d.grossTotal < 0 ? 'negative' : 'neutral');
    const pfDisplay = d.profitFactor === Infinity ? '∞' : d.profitFactor.toFixed(2);
    const wlDisplay = d.winLossRatio === Infinity ? '∞' : d.winLossRatio.toFixed(2);
    const ticks = Array.from({length: 9}).map(() => '<div></div>').join('');
    const card = (label, value, cls, sub) => `
      <div class="stat-card">
        <div class="ticks">${ticks}</div>
        <div class="stat-label">${label}</div>
        <div class="stat-value ${cls || 'neutral'}">${value}</div>
        ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
      </div>
    `;

    const bySide = [...groupByField(filtered, t => t.type)].sort((a, b) => b.count - a.count);
    const byContract = [...groupByField(filtered, t => t.contract)].sort((a, b) => b.count - a.count);

    // --- Phase 3: tilt-relevant metrics ---
    const byHour = groupByField(filtered, t => localHour(t)).sort((a, b) => parseInt(a.key) - parseInt(b.key));
    const weekdayOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const byWeekday = groupByField(filtered, t => localWeekday(t))
      .sort((a, b) => weekdayOrder.indexOf(a.key) - weekdayOrder.indexOf(b.key));
    const segMap = computeSessionSegments(filtered);
    const segOrder = ['First 20%', 'Middle 60%', 'Last 20%'];
    const bySegment = groupByField(filtered, t => segMap.get(t.id))
      .sort((a, b) => segOrder.indexOf(a.key) - segOrder.indexOf(b.key));

    const streaks = computeStreaks(filtered);
    const seq = computeSequentialStats(filtered);
    const dur = avgDurationByOutcome(filtered);

    const lastSegRow = bySegment.find(r => r.key === 'Last 20%');
    const lastSegShare = (lastSegRow && d.netTotal !== 0)
      ? (Math.abs(lastSegRow.netTotal) / Math.abs(d.netTotal) * 100) : null;

    const gapDelta = (seq.avgGapAfterLoss !== null && seq.avgGapAfterWin !== null && seq.avgGapAfterWin > 0)
      ? ((seq.avgGapAfterLoss - seq.avgGapAfterWin) / seq.avgGapAfterWin * 100) : null;
    const sizeDelta = (seq.avgSizeAfterLoss !== null && seq.avgSizeAfterWin !== null && seq.avgSizeAfterWin > 0)
      ? ((seq.avgSizeAfterLoss - seq.avgSizeAfterWin) / seq.avgSizeAfterWin * 100) : null;

    return `
      ${filterBar}
      <div class="section-label">STANDARD PERFORMANCE</div>
      <div class="stat-row" style="grid-template-columns: repeat(6, 1fr);">
        ${card('Net P&amp;L', fmtMoney(d.netTotal), netClass, `gross ${fmtMoney(d.grossTotal)}`)}
        ${card('Total cost', fmtMoney(d.costTotal), 'negative', 'fees + commissions')}
        ${card('Win rate', d.winRate.toFixed(1) + '%', 'neutral', `${d.winners}W / ${d.losers}L${d.scratch ? ' / ' + d.scratch + ' scratch' : ''}`)}
        ${card('Profit factor', pfDisplay, 'neutral', 'gross wins ÷ gross losses')}
        ${card('Win / loss ratio', wlDisplay, 'neutral', 'avg win ÷ avg loss')}
        ${card('Cost drag', d.costDrag.toFixed(1) + '%', 'neutral', fmtMoney(d.costTotal) + ' in fees')}
      </div>
      <div class="stat-row" style="grid-template-columns: repeat(3, 1fr);">
        ${card('Avg win', fmtMoney(d.avgWin), 'positive')}
        ${card('Avg loss', fmtMoney(d.avgLoss), 'negative')}
        ${card('Trades', d.n, 'neutral')}
      </div>
      <div class="section-label">BY SIDE</div>
      <div class="bar-group">${renderBarGroup(bySide, k => k || '—')}</div>

      <div class="section-label">BY CONTRACT</div>
      <div class="bar-group">${renderBarGroup(byContract, k => k || '—')}</div>

      <div class="section-label">SESSION SEGMENT <span class="section-hint">— trade position within each day's session, by elapsed time</span></div>
      <div class="bar-group">${renderBarGroup(bySegment, k => k)}</div>
      ${lastSegShare !== null ? `<div class="callout">Last 20% of the session accounts for <strong>${lastSegShare.toFixed(0)}%</strong> of total net P&amp;L magnitude.</div>` : ''}

      <div class="section-label">TIME OF DAY <span class="section-hint">— local time, Europe/Stockholm</span></div>
      <div class="bar-group">${renderBarGroup(byHour, k => k + ':00')}</div>

      <div class="section-label">DAY OF WEEK</div>
      <div class="bar-group">${renderBarGroup(byWeekday, k => k)}</div>

      <div class="section-label">LOSS STREAKS</div>
      <div class="stat-row" style="grid-template-columns: repeat(4, 1fr);">
        ${statCard(ticks, 'Longest streak', streaks.maxLen ? streaks.maxLen + ' trades' : '—', 'neutral', streaks.maxLen ? fmtMoney(streaks.maxLenCost) : '')}
        ${statCard(ticks, 'Costliest streak', streaks.worstCostLen ? streaks.worstCostLen + ' trades' : '—', 'negative', streaks.worstCostLen ? fmtMoney(streaks.worstCost) : '')}
        ${statCard(ticks, 'Streaks of 3+', streaks.streaksOf3Plus, 'neutral', 'losing streaks this length or longer')}
        ${statCard(ticks, 'Duration: win vs loss', dur.avgDurationWin !== null ? fmtSeconds(dur.avgDurationWin) + ' / ' + fmtSeconds(dur.avgDurationLoss || 0) : '—', 'neutral', 'avg hold time')}
      </div>

      <div class="section-label">BEHAVIOR AFTER A LOSS <span class="section-hint">— compared to behavior after a win, same day</span></div>
      <div class="stat-row" style="grid-template-columns: repeat(2, 1fr);">
        ${statCard(ticks, 'Time to next trade', seq.avgGapAfterLoss !== null ? fmtSeconds(seq.avgGapAfterLoss) : '—',
          gapDelta !== null && gapDelta < 0 ? 'negative' : 'neutral',
          seq.avgGapAfterWin !== null ? `vs ${fmtSeconds(seq.avgGapAfterWin)} after a win${gapDelta !== null ? ` (${gapDelta > 0 ? '+' : ''}${gapDelta.toFixed(0)}%)` : ''}` : '')}
        ${statCard(ticks, 'Size of next trade', seq.avgSizeAfterLoss !== null ? seq.avgSizeAfterLoss.toFixed(2) : '—',
          sizeDelta !== null && sizeDelta > 0 ? 'negative' : 'neutral',
          seq.avgSizeAfterWin !== null ? `vs ${seq.avgSizeAfterWin.toFixed(2)} after a win${sizeDelta !== null ? ` (${sizeDelta > 0 ? '+' : ''}${sizeDelta.toFixed(0)}%)` : ''}` : '')}
      </div>

      <div class="section-label">SELF-REPORTED CONDUCT <span class="section-hint">— from Journal entries in this date range</span></div>
      ${renderSelfReportedConduct()}

      <div class="section-label">RULE COMPLIANCE <span class="section-hint">— passive flag, checked against your Rules page</span></div>
      ${renderRuleCompliance(filtered)}

      <div class="footnote">This is a working log — come back after future sessions to see the patterns build up.</div>
    `;
  }

  function renderSelfReportedConduct() {
    const entries = journalEntries.filter(e => {
      if (dashFrom && e.date < dashFrom) return false;
      if (dashTo && e.date > dashTo) return false;
      return true;
    });
    if (entries.length === 0) {
      return `<div class="callout neutral">No journal entries in this date range yet. Log a day on the Journal tab to see adherence and mistake patterns here.</div>`;
    }
    const withAdherence = entries.map(adherenceCounts).filter(c => c.total > 0);
    const avgAdherence = withAdherence.length
      ? Math.round(withAdherence.reduce((s, c) => s + (c.passed / c.total) * 100, 0) / withAdherence.length)
      : null;
    const mistakeCounts = {};
    entries.forEach(e => (e.mistakeTags || []).forEach(t => { mistakeCounts[t] = (mistakeCounts[t] || 0) + 1; }));
    const mistakeRows = Object.entries(mistakeCounts)
      .map(([key, count]) => ({ key, count, netTotal: -count, winRate: 0 }))
      .sort((a, b) => b.count - a.count);

    const summary = avgAdherence !== null
      ? `<div class="callout ${avgAdherence >= 80 ? 'positive' : (avgAdherence < 50 ? 'negative' : 'neutral')}">Avg self-reported adherence: <strong>${avgAdherence}%</strong> across ${withAdherence.length} rated day${withAdherence.length === 1 ? '' : 's'}.</div>`
      : `<div class="callout neutral">No adherence checklist answered yet in this range.</div>`;

    const mistakesHtml = mistakeRows.length
      ? `<div class="bar-group" style="margin-top:10px;">${mistakeRows.map(r => `
          <div class="bar-row">
            <div class="bar-label">${r.key}</div>
            <div class="bar-track"><div class="bar-fill neg" style="width:${Math.max((r.count / mistakeRows[0].count) * 100, 2)}%"></div></div>
            <div class="bar-value neg">${r.count}</div>
            <div class="bar-meta">time${r.count === 1 ? '' : 's'} logged</div>
          </div>
        `).join('')}</div>`
      : `<div class="empty" style="padding:24px;">No mistake tags logged in range.</div>`;

    return summary + mistakesHtml;
  }

  function renderRuleCompliance(filteredTrades) {
    const r = rules || defaultRules();
    if (!hasAnyEnforceableRule(r)) {
      return `<div class="callout neutral">No enforceable limits set yet. Add a daily loss limit, max trades, size limit, or consecutive-loss limit on the Rules tab to see this section come alive.</div>`;
    }
    const dayAggs = computeDayAggregates(filteredTrades);
    const withViolations = dayAggs
      .map(d => ({ ...d, violations: checkDayViolations(d, r) }))
      .filter(d => d.violations.length > 0);

    if (dayAggs.length === 0) {
      return `<div class="empty" style="padding:24px;">No trades in range to check.</div>`;
    }
    if (withViolations.length === 0) {
      return `<div class="callout positive">No rule violations in ${dayAggs.length} day${dayAggs.length === 1 ? '' : 's'} in range.</div>`;
    }
    const rows = withViolations.map(d => `
      <div class="violation-row">
        <div class="violation-date">${d.date}</div>
        <div class="violation-badges">${d.violations.map(v => `<span class="violation-badge">${v}</span>`).join('')}</div>
      </div>
    `).join('');
    return `
      <div class="callout negative">${withViolations.length} of ${dayAggs.length} day${dayAggs.length === 1 ? '' : 's'} in range broke at least one rule.</div>
      <div class="bar-group" style="margin-top:10px;">${rows}</div>
    `;
  }

  function computeDayTradeSummary(dateStr) {
    const dayTrades = trades.filter(t => tradeLocalDateStr(t) === dateStr);
    if (!dayTrades.length) return null;
    const netTotal = dayTrades.reduce((s, t) => s + t.pnl_net, 0);
    const wins = dayTrades.filter(t => t.pnl_net > 0).length;
    return { count: dayTrades.length, netTotal, winRate: (wins / dayTrades.length) * 100 };
  }

  function allJournalTags() {
    const tagSet = new Set();
    journalEntries.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
    return [...tagSet].sort();
  }

  function filterJournalEntries() {
    return journalEntries
      .filter(e => {
        if (journalFrom && e.date < journalFrom) return false;
        if (journalTo && e.date > journalTo) return false;
        if (journalTagFilter && !(e.tags || []).includes(journalTagFilter)) return false;
        if (journalMistakeFilter && !(e.mistakeTags || []).includes(journalMistakeFilter)) return false;
        if (journalRulesBrokenOnly && adherenceCounts(e).failed === 0) return false;
        return true;
      })
      .sort((a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || ''));
  }

  // Counts adherence answers for one entry. Unanswered rules are excluded from
  // both passed/failed/total so a partially-filled checklist isn't scored as broken.
  function adherenceCounts(entry) {
    const a = entry.adherence || {};
    const answered = ADHERENCE_RULES.filter(r => a[r.id] !== undefined && a[r.id] !== null);
    const passed = answered.filter(r => a[r.id] === true).length;
    return { passed, failed: answered.length - passed, total: answered.length };
  }

  function allMistakeTagsUsed() {
    const set = new Set();
    journalEntries.forEach(e => (e.mistakeTags || []).forEach(t => set.add(t)));
    return MISTAKE_TAGS.filter(t => set.has(t));
  }

  function moodPickerHtml(selected, name, count) {
    count = count || 10;
    let buttons = '';
    for (let n = 1; n <= count; n++) {
      buttons += `<button type="button" class="mood-pick ${selected === n ? 'active' : ''}" data-mood-pick="${n}" data-mood-name="${name}">${n}</button>`;
    }
    return `<div class="mood-picker" data-mood-group="${name}">${buttons}</div>`;
  }

  // Coin-fill picker: every coin is the same size, filled gold up to the
  // selected value (like a stack of caught combines) rather than only the
  // exact pick lighting up. Reuses the mood-pick data attributes so the
  // existing click handler in wireJournalTab works unchanged.
  function coinPickerHtml(selected, name, count) {
    count = count || 5;
    let coins = '';
    for (let n = 1; n <= count; n++) {
      const filled = selected != null && n <= selected;
      coins += `<button type="button" class="coin ${filled ? 'filled' : ''}" data-mood-pick="${n}" data-mood-name="${name}">${n}</button>`;
    }
    return `<div class="coin-picker" data-mood-group="${name}">${coins}</div>`;
  }

  function tagPillsHtml(list, selected, group) {
    return `<div class="mood-picker" data-tag-group="${group}">${list.map(t =>
      `<button type="button" class="tag-pill pickable ${selected.includes(t) ? 'selected' : ''}" data-tag-pill="${t}" data-tag-group="${group}">${t}</button>`
    ).join('')}</div>`;
  }

  function renderJournalForm() {
    const isEditing = !!journalDraft.id;
    const a = journalDraft.adherence || {};
    const checklistHtml = ADHERENCE_RULES.map(r => `
      <label class="check-row">
        <input type="checkbox" data-adherence="${r.id}" ${a[r.id] ? 'checked' : ''}>
        <span${r.emphasis ? ' style="font-weight:700; color:var(--negative);"' : ''}>${r.label}</span>
      </label>
    `).join('');
    const dayNet = computeDayTradeSummary(journalDraft.date);

    return `
      <div class="journal-form">
        <div class="journal-form-header">${isEditing ? 'EDIT ENTRY' : 'NEW ENTRY'}</div>
        <div class="journal-form-row">
          <label>DATE <input type="date" id="journal-date" value="${journalDraft.date}"></label>
          <label>TAGS <input type="text" id="journal-tags" placeholder="e.g. revenge trade, good discipline" value="${(journalDraft.tags || []).join(', ')}"></label>
        </div>
        <div class="journal-form-row">
          <div class="mood-label-row">MOOD / TILT RATING${journalDraft.mood ? `<span class="mood-current">${journalDraft.mood}</span>` : ''}</div>
          ${moodPickerHtml(journalDraft.mood, 'mood', 10)}
        </div>

        <div class="section-label">ADHERENCE CHECKLIST <span class="section-hint">— tick only what actually held today; leave the rest unchecked</span></div>
        <div class="check-grid">${checklistHtml}</div>

        <div class="mood-label-row" style="margin-top:14px;">HOW DID YOU FEEL?</div>
        ${tagPillsHtml(EMOTION_TAGS, journalDraft.emotionTags || [], 'emotion')}

        <div class="mood-label-row" style="margin-top:14px;">ANY MISTAKES?</div>
        ${tagPillsHtml(MISTAKE_TAGS, journalDraft.mistakeTags || [], 'mistake')}

        <div class="mood-label-row" style="margin-top:14px;">DAY RATING <span class="section-hint">— process, not P&amp;L</span>${journalDraft.dayRating ? `<span class="mood-current">${journalDraft.dayRating}</span>` : ''}</div>
        ${moodPickerHtml(journalDraft.dayRating, 'dayRating', 5)}

        <textarea id="journal-text" placeholder="How did the session feel? What triggered decisions today?" style="margin-top:14px;">${journalDraft.text || ''}</textarea>

        <div class="section-label" style="margin-top:14px;">FINANCIAL TARGET</div>
        <label class="check-row">
          <input type="checkbox" id="journal-target-hit" ${journalDraft.targetHit ? 'checked' : ''}>
          <span>Any Combines caught Today?</span>
        </label>
        ${dayNet
          ? `<div class="target-hint ${dayNet.netTotal >= COMBINE_COST ? 'pos' : 'neg'}">${fmtMoney(dayNet.netTotal)} net today from ${dayNet.count} trade${dayNet.count === 1 ? '' : 's'} — ${dayNet.netTotal >= COMBINE_COST ? 'covers the $120 cost' : `${fmtMoney(COMBINE_COST - dayNet.netTotal)} short of it`}</div>`
          : `<div class="target-hint muted">No trades logged for this date yet — nothing to compare against $120.</div>`}
        <div style="margin-top:10px;">${coinPickerHtml(journalDraft.targetRating, 'targetRating', 5)}</div>

        <div class="journal-form-actions" style="margin-top:22px;">
          <button class="upload-btn" id="journal-save">Save entry</button>
          ${isEditing ? `<button class="filter-btn ghost" id="journal-cancel">Cancel</button>` : ''}
        </div>
      </div>
    `;
  }

  function renderJournalEntry(entry) {
    const summary = computeDayTradeSummary(entry.date);
    const netClass = summary && summary.netTotal > 0 ? 'pos' : (summary && summary.netTotal < 0 ? 'neg' : '');
    const confirming = confirmDeleteId === entry.id;
    const ac = adherenceCounts(entry);
    const failedRules = ADHERENCE_RULES.filter(r => entry.adherence && entry.adherence[r.id] === false);
    const adherenceClass = ac.total === 0 ? '' : (ac.failed === 0 ? 'pos' : (ac.passed === 0 ? 'neg' : ''));
    return `
      <div class="journal-entry">
        <div class="journal-entry-header">
          <div class="journal-entry-date">${entry.date}</div>
          ${entry.mood ? `<div class="journal-entry-mood">MOOD ${entry.mood}</div>` : ''}
          ${entry.dayRating ? `<div class="journal-entry-mood">DAY ${entry.dayRating}/5</div>` : ''}
          ${entry.targetHit ? `<div class="journal-entry-mood pos">COMBINES CAUGHT</div>` : ''}
          ${entry.targetRating ? `<div class="journal-entry-mood">COMBINES CAUGHT ${entry.targetRating}/5</div>` : ''}
          <div class="journal-entry-actions">
            <button class="mini-btn" data-edit-id="${entry.id}">Edit</button>
            <button class="mini-btn ${confirming ? 'danger' : ''}" data-delete-id="${entry.id}">${confirming ? 'Confirm delete' : 'Delete'}</button>
          </div>
        </div>
        ${summary ? `<div class="journal-entry-summary">${summary.count} trade${summary.count === 1 ? '' : 's'} that day · <span class="${netClass}">${fmtMoney(summary.netTotal)}</span> net · ${summary.winRate.toFixed(0)}% win rate</div>` : ''}
        ${ac.total > 0 ? `<div class="journal-entry-summary ${adherenceClass}">RULES ${ac.passed}/${ac.total}</div>` : ''}
        ${failedRules.length ? `<div class="journal-entry-tags">${failedRules.map(r => `<span class="violation-badge">${r.label}</span>`).join('')}</div>` : ''}
        ${(entry.mistakeTags && entry.mistakeTags.length) ? `<div class="journal-entry-tags">${entry.mistakeTags.map(t => `<span class="violation-badge">${t}</span>`).join('')}</div>` : ''}
        ${(entry.emotionTags && entry.emotionTags.length) ? `<div class="journal-entry-tags">${entry.emotionTags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>` : ''}
        ${(entry.tags && entry.tags.length) ? `<div class="journal-entry-tags">${entry.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>` : ''}
        <div class="journal-entry-text">${entry.text ? entry.text.replace(/</g, '&lt;') : '<span class="empty-text">No notes.</span>'}</div>
      </div>
    `;
  }

  function renderJournalStats(filtered) {
    if (filtered.length === 0) return '';
    const withAdherence = filtered.map(adherenceCounts).filter(c => c.total > 0);
    const avgAdherence = withAdherence.length
      ? Math.round(withAdherence.reduce((s, c) => s + (c.passed / c.total) * 100, 0) / withAdherence.length)
      : null;
    const rated = filtered.filter(e => e.dayRating != null);
    const avgRating = rated.length ? (rated.reduce((s, e) => s + e.dayRating, 0) / rated.length).toFixed(1) : null;
    const targetHitRate = Math.round(filtered.filter(e => e.targetHit).length / filtered.length * 100);
    const targetRated = filtered.filter(e => e.targetRating != null);
    const avgTargetRating = targetRated.length ? (targetRated.reduce((s, e) => s + e.targetRating, 0) / targetRated.length).toFixed(1) : null;
    const mistakeCounts = {};
    filtered.forEach(e => (e.mistakeTags || []).forEach(t => { mistakeCounts[t] = (mistakeCounts[t] || 0) + 1; }));
    const topMistake = Object.entries(mistakeCounts).sort((a, b) => b[1] - a[1])[0];
    const ticks = Array.from({length: 9}).map(() => '<div></div>').join('');
    return `
      <div class="stat-row" style="grid-template-columns: repeat(4, 1fr);">
        ${statCard(ticks, 'Entries in range', filtered.length, 'neutral')}
        ${statCard(ticks, 'Avg adherence', avgAdherence !== null ? avgAdherence + '%' : '—', avgAdherence === null ? 'neutral' : (avgAdherence >= 80 ? 'positive' : (avgAdherence < 50 ? 'negative' : 'neutral')))}
        ${statCard(ticks, 'Avg day rating', avgRating !== null ? avgRating + '/5' : '—', 'neutral')}
        ${statCard(ticks, 'Top mistake', topMistake ? topMistake[0] : '—', topMistake ? 'negative' : 'neutral', topMistake ? topMistake[1] + ' time' + (topMistake[1] === 1 ? '' : 's') : '')}
      </div>
      <div class="stat-row" style="grid-template-columns: repeat(2, 1fr);">
        ${statCard(ticks, 'Target hit rate', targetHitRate + '%', targetHitRate >= 80 ? 'positive' : (targetHitRate < 50 ? 'negative' : 'neutral'), '$120/day combine cost')}
        ${statCard(ticks, 'Avg target rating', avgTargetRating !== null ? avgTargetRating + '/5' : '—', 'neutral')}
      </div>
    `;
  }

  function renderJournalTab() {
    if (!journalDraft) {
      journalDraft = emptyDraft();
    }
    const tags = allJournalTags();
    const mistakesUsed = allMistakeTagsUsed();
    const filtered = filterJournalEntries();

    const filterBar = `
      <div class="filter-bar">

      ? filtered.map(renderJournalEntry).join('')
      : `<div class="empty"><div class="big">NO ENTRIES${journalEntries.length ? ' IN RANGE' : ' YET'}</div>${journalEntries.length ? 'Adjust the filters above.' : 'Log your first entry above.'}</div>`;

    return `

    // mood / day-rating / target-rating picker buttons (draft only, since entries themselves aren't inline-editable)

        const fields = {
          date, tags, text, mood: journalDraft.mood,
          adherence, emotionTags: journalDraft.emotionTags || [], mistakeTags: journalDraft.mistakeTags || [],
          dayRating: journalDraft.dayRating,
          targetHit: !!journalDraft.targetHit, targetRating: journalDraft.targetRating
        };
        if (journalDraft.id) {
          const existing = journalEntries.find(e => e.id === journalDraft.id);
          if (existing) {
            Object.assign(existing, fields, { updated_at: new Date().toISOString() });
          }
        } else {
          journalEntries.push({
            id: 'j_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            ...fields,
            created_at: new Date().toISOString()
          });
        }
        await saveJournal();
        journalDraft = emptyDraft();
        render();
      });
    }

    const cancelBtn = root.querySelector('#journal-cancel');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        journalDraft = emptyDraft();
        render();
      });
    }

    root.querySelectorAll('[data-edit-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const entry = journalEntries.find(e => e.id === btn.dataset.editId);
        if (entry) {
          journalDraft = {
            id: entry.id, date: entry.date, mood: entry.mood, tags: entry.tags || [], text: entry.text || '',
            adherence: { ...(entry.adherence || {}) },
            emotionTags: [...(entry.emotionTags || [])],
            mistakeTags: [...(entry.mistakeTags || [])],
            dayRating: entry.dayRating,
            targetHit: !!entry.targetHit, targetRating: entry.targetRating
          };
          confirmDeleteId = null;
          render();
          const formEl = root.querySelector('.journal-form');
          if (formEl && typeof formEl.scrollIntoView === 'function') {
            formEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    root.querySelectorAll('[data-delete-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.deleteId;
        if (confirmDeleteId === id) {
          journalEntries = journalEntries.filter(e => e.id !== id);
          confirmDeleteId = null;
          await saveJournal();
          render();

          confirmDeleteId = id;
