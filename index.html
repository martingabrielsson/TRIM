<meta charset="utf-8">
<div id="trim-root"></div>
<style>
  #trim-root {
    --bg1: #e9ebef;
    --bg2: #f8efd9;
    --panel: #ffffff;
    --panel-soft: #f5f2ec;
    --line: #eae5da;
    --ink: #1a1b1f;
    --ink-invert: #f7f5f0;
    --muted: #8b8e94;
    --amber: #f4c44e;
    --amber-deep: #a9791f;
    --positive: #3f8f74;
    --negative: #d1573f;

    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 640px;
    border-radius: 28px;
    padding: 0;
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(23,24,28,0.04), 0 24px 60px rgba(23,24,28,0.10);
  }
  #trim-root * { box-sizing: border-box; }
  #trim-root .mono { font-family: 'IBM Plex Mono', 'SF Mono', 'Courier New', monospace; }

  /* ---- Header ---- */
  #trim-root .header {
    padding: 26px 32px 18px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #trim-root .wordmark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }
  #trim-root .wordmark span { color: var(--amber-deep); }
  #trim-root .wordmark-logo { display: block; height: 102px; width: auto; }
  #trim-root .tagline {
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-top: 3px;
  }
  #trim-root .instrument-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-align: right;
    line-height: 1.6;
  }

  /* ---- Nav (pill segmented control) ---- */
  #trim-root .nav {
    display: flex;
    gap: 6px;
    padding: 6px 32px 20px 32px;
  }
  #trim-root .nav button {
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #trim-root .nav button:hover { color: var(--ink); border-color: #d8d3c6; }
  #trim-root .nav button.active {
    color: var(--ink-invert);
    background: var(--ink);
    border-color: var(--ink);
  }
  #trim-root .nav button .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    margin-left: 6px;
    position: relative;
    top: -1px;
  }
  #trim-root .nav button.disabled { color: #c3c0b8; cursor: default; }

  /* ---- Body ---- */
  #trim-root .body { padding: 6px 32px 34px 32px; }

  /* ---- Gauge ticks decoration on cards ---- */
  #trim-root .ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 3px;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  #trim-root .ticks div { width: 1px; height: 5px; background: #e0dccf; }
  #trim-root .ticks div:nth-child(3n) { height: 7px; background: var(--amber); }

  /* ---- Stat cards ---- */
  #trim-root .stat-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  #trim-root .stat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px 16px 16px;
    box-shadow: 0 1px 2px rgba(23,24,28,0.03), 0 6px 16px rgba(23,24,28,0.04);
  }
  #trim-root .stat-label {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  #trim-root .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  #trim-root .stat-value.positive { color: var(--positive); }
  #trim-root .stat-value.negative { color: var(--negative); }
  #trim-root .stat-value.neutral { color: var(--ink); }
  #trim-root .stat-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ---- Five-year board ---- */
  #trim-root .board {
    --cell: 20px;
    --gap: 3px;
    --green: var(--positive);
    --yellow: #e0a92e;
    --red: var(--negative);
    --black: var(--ink);
  }
  #trim-root .board.dense-s { --cell: 14px; --gap: 2px; }
  #trim-root .board.dense-l { --cell: 28px; --gap: 4px; }

  #trim-root .board-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #trim-root .board-legend .leg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  #trim-root .board-legend .swatch {
    width: 11px; height: 11px;
    border-radius: 3px;
    border: 1px solid var(--line);
  }
  #trim-root .board-legend .swatch.g { background: var(--green); border-color: var(--green); }
  #trim-root .board-legend .swatch.y { background: var(--yellow); border-color: var(--yellow); }
  #trim-root .board-legend .swatch.r { background: var(--red); border-color: var(--red); }
  #trim-root .board-legend .swatch.b { background: var(--black); border-color: var(--black); }
  #trim-root .board-legend .swatch.n { background: var(--panel); }

  #trim-root .board-readout {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    margin-bottom: 12px;
    min-height: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.03em;
  }
  #trim-root .board-readout .placeholder { color: var(--muted); letter-spacing: 0.06em; }
  #trim-root .board-readout .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    flex: none;
  }
  #trim-root .board-readout .dot.g { background: var(--green); border-color: var(--green); }
  #trim-root .board-readout .dot.y { background: var(--yellow); border-color: var(--yellow); }
  #trim-root .board-readout .dot.r { background: var(--red); border-color: var(--red); }
  #trim-root .board-readout .dot.b { background: var(--black); border-color: var(--black); }
  #trim-root .board-readout .sep { color: #d5d0c2; }
  #trim-root .board-readout .muted { color: var(--muted); }

  #trim-root .board-band { margin-bottom: 20px; }
  #trim-root .board-band-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-top: 1px solid #ddd7c8;
    padding-top: 9px;
    margin-bottom: 9px;
  }
  #trim-root .board-band-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--ink);
  }
  #trim-root .board-band-range {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--amber-deep);
  }
  #trim-root .board-band-meta {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  #trim-root .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr));
    gap: var(--gap);
  }
  #trim-root .board-cell {
    aspect-ratio: 1 / 1;
    min-width: 0;
    padding: 0;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    cursor: pointer;
    position: relative;
    transition: transform 0.08s ease;
  }
  #trim-root .board-cell:hover { transform: scale(1.22); z-index: 3; border-color: var(--amber-deep); }
  #trim-root .board-cell[data-mark="g"] { background: var(--green); border-color: var(--green); }
  #trim-root .board-cell[data-mark="y"] { background: var(--yellow); border-color: var(--yellow); }
  #trim-root .board-cell[data-mark="r"] { background: var(--red); border-color: var(--red); }
  #trim-root .board-cell[data-mark="b"] { background: var(--black); border-color: var(--black); }
  #trim-root .board-cell.future:not([data-mark]) { background: var(--panel-soft); border-color: #efeade; }
  /* amber rather than ink, so today stays visible on a black (didn't-trade) square */
  #trim-root .board-cell.today { border-color: var(--amber-deep); border-width: 2px; }
  /* month / quarter boundary ticks — dark inset bar stays visible over any fill */
  #trim-root .board-cell.month-start { box-shadow: inset 2px 0 0 rgba(26,27,31,0.38); }
  #trim-root .board-cell.quarter-start { box-shadow: inset 3px 0 0 rgba(26,27,31,0.75); }
  #trim-root .board-cell:focus { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 4; }
  #trim-root .board-cell.flash { animation: board-flash 0.9s ease-out 2; }
  #trim-root .board-cell.has-comment::after {
    content: '';
    position: absolute;
    top: 1px; right: 1px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ink-invert);
    border: 1px solid var(--ink);
  }

  #trim-root .board-comment {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 15px;
    margin-bottom: 16px;
  }
  #trim-root .board-comment .placeholder {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  #trim-root .board-comment-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--amber-deep);
    font-weight: 700;
    margin-bottom: 8px;
  }
  #trim-root .board-comment textarea {
    width: 100%;
    min-height: 60px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    line-height: 1.55;
    padding: 9px 11px;
    border-radius: 10px;
    resize: vertical;
  }
  #trim-root .board-comment textarea::placeholder { color: #b3aea0; }
  #trim-root .board-comment-saved {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  @keyframes board-flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(169,121,31,0); }
    50% { box-shadow: 0 0 0 4px rgba(169,121,31,0.55); }
  }

  #trim-root .board-stack { display: flex; height: 100%; width: 100%; }
  #trim-root .board-stack .seg { height: 100%; }
  #trim-root .board-stack .seg.g { background: var(--green); }
  #trim-root .board-stack .seg.y { background: var(--yellow); }
  #trim-root .board-stack .seg.r { background: var(--red); }
  #trim-root .board-stack .seg.b { background: var(--black); }

  /* ---- Upload zone ---- */
  #trim-root .upload-zone {
    border: 1.5px dashed #d8d3c6;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    margin-bottom: 22px;
    background: var(--panel-soft);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #trim-root .upload-zone.dragover {
    border-color: var(--amber-deep);
    background: #fbf1d6;
  }
  #trim-root .upload-zone .icon-line {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--amber-deep);
    font-size: 12px;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    font-weight: 600;
  }
  #trim-root .upload-zone .sub {
    color: var(--muted);
    font-size: 11.5px;
    margin-bottom: 14px;
  }
  #trim-root .upload-btn {
    background: var(--ink);
    color: var(--ink-invert);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  #trim-root .upload-btn:hover { background: #2c2e34; }
  #trim-root .upload-status {
    margin-top: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--positive);
  }
  #trim-root .upload-status.error { color: var(--negative); }

  /* ---- Table ---- */
  #trim-root .table-wrap {
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: var(--panel);
  }
  #trim-root table { width: 100%; border-collapse: collapse; }
  #trim-root thead { background: var(--panel-soft); }
  #trim-root th {
    text-align: left;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  #trim-root th:hover { color: var(--amber-deep); }
  #trim-root th.sorted { color: var(--amber-deep); }
  #trim-root td {
    padding: 9px 12px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    color: var(--ink);
  }
  #trim-root tbody tr:hover { background: var(--panel-soft); }
  #trim-root tbody tr:last-child td { border-bottom: none; }
  #trim-root td.pos { color: var(--positive); }
  #trim-root td.neg { color: var(--negative); }
  #trim-root .side-tag {
    font-size: 9.5px;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  #trim-root .side-tag.long { background: rgba(63,143,116,0.12); color: var(--positive); }
  #trim-root .side-tag.short { background: rgba(209,87,63,0.12); color: var(--negative); }
  #trim-root .mood-select {
    background: var(--panel-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 6px;
  }

  /* ---- Empty state ---- */
  #trim-root .empty {
    text-align: center;
    padding: 54px 20px;
    color: var(--muted);
    font-size: 12.5px;
  }
  #trim-root .empty .big { font-family: 'IBM Plex Mono', monospace; color: var(--amber-deep); font-size: 13px; margin-bottom: 8px; letter-spacing: 0.06em; font-weight: 700; }

  /* ---- Coming soon panel ---- */
  #trim-root .soon {
    padding: 60px 30px;
    text-align: center;
    color: var(--muted);
  }
  #trim-root .soon .gauge-face {
    width: 90px; height: 45px;
    margin: 0 auto 18px auto;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 90px 90px 0 0;
    position: relative;
    background: var(--panel-soft);
  }
  #trim-root .soon .gauge-needle {
    position: absolute;
    bottom: 0; left: 50%;
    width: 1px; height: 34px;
    background: #c9c3b3;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(-20deg);
  }
  #trim-root .soon h3 {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 0.06em;
    margin: 0 0 8px 0;
  }
  #trim-root .soon p { font-size: 12px; max-width: 380px; margin: 0 auto; line-height: 1.6; }
  #trim-root .soon .phase {
    display: inline-block;
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--amber-deep);
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 5px 12px;
    border-radius: 999px;
  }

  #trim-root .footnote {
    margin-top: 16px;
    font-size: 10.5px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ---- Dashboard: filter bar ---- */
  #trim-root .filter-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  #trim-root .filter-bar label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #trim-root .filter-bar input[type="date"] {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 8px;
  }
  #trim-root .filter-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--amber-deep);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  #trim-root .filter-btn:hover { background: #fbf1d6; border-color: var(--amber); }
  #trim-root .filter-btn.ghost { color: var(--muted); border-color: var(--line); background: var(--panel); }
  #trim-root .filter-count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
  }
  #trim-root .filter-bar select {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 8px;
  }

  /* ---- Journal ---- */
  #trim-root .journal-form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(23,24,28,0.03), 0 6px 16px rgba(23,24,28,0.04);
  }
  #trim-root .journal-form-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--amber-deep);
    font-weight: 700;
    margin-bottom: 14px;
  }
  #trim-root .journal-form-row {
    display: flex;
    gap: 18px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  #trim-root .journal-form-row label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 200px;
  }
  #trim-root .journal-form-row input[type="date"],
  #trim-root .journal-form-row input[type="text"] {
    background: var(--panel-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 8px;
    flex: 1;
    min-width: 0;
  }
  #trim-root .mood-label-row {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #trim-root .mood-current {
    color: var(--amber-deep);
    font-size: 12px;
    font-weight: 700;
  }
  #trim-root .mood-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  #trim-root .mood-pick {
    width: 28px; height: 28px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-soft);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #trim-root .mood-pick:hover { border-color: var(--amber); color: var(--ink); }
  #trim-root .mood-pick.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #3d2f0a;
    font-weight: 700;
  }
  #trim-root .coin-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #trim-root .coin {
    width: 34px; height: 34px;
    border-radius: 999px;
    border: 1px solid #d8d3c6;
    background: var(--panel-soft);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #trim-root .coin:hover { border-color: var(--amber); color: var(--ink); transform: scale(1.06); }
  #trim-root .coin.filled {
    background: radial-gradient(circle at 34% 30%, #ffe9a8 0%, var(--amber) 55%, var(--amber-deep) 100%);
    border-color: var(--amber-deep);
    color: #3d2f0a;
